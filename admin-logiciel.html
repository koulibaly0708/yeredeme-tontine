<style>

.af{width:100%;max-width:420px;text-align:center}.af label{display:block;text-align:left}.af .row{justify-content:center}.af .mu{text-align:left}.af .btn:not(.s){width:100%}

.bar{position:sticky;top:0;z-index:5;background:var(--bg)}

.tkw{max-width:300px;margin:0 auto 8px;border:1px dashed var(--mu);padding:10px;border-radius:6px;font-size:14px}.a6w{max-width:400px;margin:0 auto 8px}
@media print{.pz.tk{width:70mm;font-size:11px}}
.tag.rg{background:#b3261e;color:#fff}.tag.gn{background:#1f8a3a;color:#fff}.f31 i.x{background:#d9d9d9;color:#8a8a8a;border-color:#cfcfcf}

@media print{.pz .f31 i.x{background:#d9d9d9!important;color:#8a8a8a!important}.pz .ban{font-size:22px}}

<div id="app"></div>
<script>
const $=id=>document.getElementById(id),T=()=>new Date().toISOString().slice(0,10),F=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+' GNF',num=v=>+String(v).replace(/\D/g,'')||0,fmtI=e=>{const d=e.value.replace(/\D/g,'');e.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={users:[],mem:[],dep:[],ret:[],grp:[],set:{com:1},cfg:{},app:[],abo:[],rem:[],org:{},seq:{}};
try{D=Object.assign(D,JSON.parse(localStorage.getItem('yt')||'{}'))}catch(e){}
const ph=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00224'))d=d.slice(5);else if(d.startsWith('224')&&d.length>=12)d=d.slice(3);return d};
D.users.forEach(u=>u.tel=ph(u.tel));D.mem.forEach(m=>m.tel=ph(m.tel));
const save=()=>{try{localStorage.setItem('yt',JSON.stringify(D))}catch(e){alert("Enregistrement impossible : espace plein.")}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
D.seq=D.seq||{};
const nextSn=a=>{D.seq[a]=(D.seq[a]||0)+1;return 'TN-'+String(D.seq[a]).padStart(4,'0')};
if(D.mem.some(m=>!m.sn)){D.mem.forEach(m=>{if(!m.sn){const c=D.users.find(u=>u.id==m.mgr);m.sn=nextSn(c?c.adm:'x')}});try{localStorage.setItem('yt',JSON.stringify(D))}catch(e){}}
const isCl=m=>m.statut=='normal'||m.statut=='interrompu';
const tg=m=>`<span class="tag ${m.statut=='interrompu'?'rg':m.statut=='normal'?'gn':''}">${stt(m)}</span>`;
const ban=m=>m.statut=='normal'?'<div class="ban gn">Clôturé et payé</div>':m.statut=='interrompu'?'<div class="ban rg">Clôturé interrompu et payé</div>':m.statut=='attente'?'<div class="ban">Clôture en attente de validation</div>':'';
const owed=m=>{const c=D.users.find(u=>u.id==m.mgr),t=tot(m),cm=Math.min(cfg(c&&c.adm).com*m.mise,t);return Math.max(0,t-cm)};
const tot=m=>D.dep.filter(d=>d.mid==m.id).reduce((a,d)=>a+d.montant,0),carr=m=>Math.min(31,Math.floor(tot(m)/m.mise)),
stt=m=>m.statut=='normal'?'Clôturé normal':m.statut=='interrompu'?'Clôturé interrompu':m.statut=='attente'?'Clôture en attente de validation':'En cours';
let S={u:null,view:'h',menu:false,tab:'',m:null,day:T(),per:'j',photo:'',mode:'in'};
const TTL={g:'Espace collecteur',a:'Espace adhérent',ad:'Administrateur de tontine',sa:'Administrateur du logiciel'};
const roleLbl=u=>{const f=u.sx=='f';return u.role=='a'?(f?'Cliente':'Client'):u.role=='g'?(f?'Collectrice':'Collecteur'):u.role=='ad'?(f?'Administratrice de tontine':'Administrateur de tontine'):'Administrateur du logiciel'};
const adm=u=>D.users.find(x=>x.id==u.adm);
function msgU(u){if(u.role=='ad')return !u.actif?"Compte en attente d'activation par l'administrateur du logiciel.":(u.exp||'')<T()?"Abonnement expiré. Contactez l'administrateur du logiciel.":'';
if(u.role=='g'){if(u.actif===false)return 'Compte suspendu par votre administrateur.';const a=adm(u);return a?msgU(a):"Compte non rattaché à un administrateur de tontine."}return''}
function login(r,start){try{S.u=D.users.find(x=>x.id==localStorage.getItem('yt_'+r))||null}catch(e){}if(S.u&&msgU(S.u))S.u=null;S.tab=start;S.view='h';S.u?dash():authView()}
function authView(){const cu=R=='a'||R=='ad'||(R=='sa'&&!D.users.some(u=>u.role=='sa')),setup=R=='sa'&&cu;if(!cu)S.mode='in';if(setup)S.mode='up';const up=S.mode=='up';
$('app').innerHTML=`<div class="bar"><a class="plat" href="${R=='sa'?'#':'index.html'}"><img src="logo.png" alt="Yèrèdèmè Tontine"></a></div><div class="au"><div class="af"><div class="lgw"><img src="logo.png" alt="Yèrèdèmè Tontine"></div><h2>${TTL[R]}</h2>
${setup?'<p class="mu">Première utilisation : créez le compte administrateur du logiciel.</p>':cu?`<div class="row"><button class="btn s ${up?'o':''}" onclick="S.mode='in';authView()">Connexion</button><button class="btn s ${up?'':'o'}" onclick="S.mode='up';authView()">Inscription</button></div>`:''}
${up?'<label>Nom complet</label><input id="an">'+(R!='sa'?'<label>Genre</label><select id="ag"><option value="m">Homme</option><option value="f">Femme</option></select>':''):''}<label>Téléphone (sans +224)</label><input id="at" inputmode="tel" placeholder="6XX XX XX XX"><label>Mot de passe</label><input id="ap" type="password">
<button class="btn" onclick="go()">${up?'Créer mon compte':'Se connecter'}</button>${up&&R=='a'?'<p class="mu">Utilisez le numéro donné à votre collecteur pour voir vos tontines.</p>':''}${up&&R=='ad'?'<p class="mu">Votre compte sera utilisable après activation de votre abonnement.</p>':''}${R=='g'?'<p class="mu">Votre compte est créé par votre administrateur de tontine.</p>':''}</div></div>`}
function go(){const t=ph($('at').value),p=$('ap').value;if(!t||!p)return alert('Renseignez téléphone et mot de passe.');let u=D.users.find(x=>x.tel==t&&x.role==R);
if(S.mode=='up'){const n=$('an').value.trim();if(!n)return alert('Renseignez votre nom.');if(u)return alert('Ce numéro a déjà un compte. Connectez-vous.');if(R=='sa'&&D.users.some(x=>x.role=='sa'))return;
u={id:uid(),role:R,nom:n,tel:t,pwd:p,sx:($('ag')||{}).value||'m'};if(R=='ad'){u.actif=false;u.exp=''}D.users.push(u);save();
if(R=='ad'){alert("Compte créé. Il sera utilisable après activation de votre abonnement par l'administrateur du logiciel.");S.mode='in';return authView()}}
else{if(!u||u.pwd!=p)return alert('Téléphone ou mot de passe incorrect.');const m=msgU(u);if(m)return alert(m)}
try{localStorage.setItem('yt_'+R,u.id)}catch(e){}S.u=u;dash()}
function out(){try{localStorage.removeItem('yt_'+R)}catch(e){}location.href=R=='sa'?'admin-logiciel.html':'index.html'}
function dash(){const TL=Object.fromEntries(TABS),I=TI,G=TG,
bar=`<div class="bar np"><a class="plat" href="${R=='sa'?'#':'index.html'}"><img src="logo.png" alt="Yèrèdèmè Tontine"></a><div class="usr"><div class="un"><b>${esc(S.u.nom)}</b><small>${roleLbl(S.u)}</small></div><button class="btn o s" onclick="out()">Déconnexion</button></div></div>`;
if(S.view=='h'){$('app').innerHTML=bar+`<div class="w">${G.map(([g,ids])=>`<section class="nv-g"><h3 class="nv-gt">${g}</h3><div class="nv-tiles">${ids.map(k=>`<button class="nv-tile" onclick="nav('${k}')"><span class="nv-ti" aria-hidden="true">${I[k]}</span><span>${TL[k]}</span></button>`).join('')}</div></section>`).join('')}</div>`;return}
$('app').innerHTML=bar+`<div class="w"><div class="nv-nav np"><div class="nv-bar"><button class="nv-b" onclick="navHome()">← Accueil</button><h2 class="nv-t">${TL[S.tab]}</h2><button class="nv-b m" aria-expanded="${S.menu}" onclick="S.menu=!S.menu;dash()">Menu ▾</button></div>
${S.menu?`<nav class="nv-mnu">${G.map(([g,ids])=>`<h3 class="nv-gt">${g}</h3><div class="nv-mg">${ids.map(k=>`<button class="nv-mi" aria-selected="${k==S.tab}" onclick="nav('${k}')"><span class="nv-ti" aria-hidden="true">${I[k]}</span>${TL[k]}</button>`).join('')}</div>`).join('')}</nav>`:''}</div><div id="v"></div></div>`;
$('v').innerHTML=S.m?detail():V[S.tab]()}
function nav(k){if(S.view!='t')history.pushState({t:1},'');S.view='t';S.tab=k;S.m=null;S.menu=false;dash();scrollTo(0,0)}
function navHome(){if(history.state&&history.state.t)history.back();else{S.view='h';S.m=null;S.menu=false;dash()}}
addEventListener('popstate',()=>{S.view='h';S.m=null;S.menu=false;if(S.u)dash()});
const cfg=a=>Object.assign({com:1,mode:'pct',val:0},D.cfg&&D.cfg[a]);
const split=(a,m)=>{const c=cfg(a),cm=c.com*m.mise,cc=c.mode=='fix'?c.val:Math.round(cm*c.val/100);return{cm,cc:Math.max(0,Math.min(cc,cm))}};
const colls=()=>R=='ad'?D.users.filter(u=>u.role=='g'&&u.adm==S.u.id):[];
const mine=()=>R=='g'?D.mem.filter(m=>m.mgr==S.u.id):R=='ad'?D.mem.filter(m=>colls().some(c=>c.id==m.mgr)):R=='sa'?[]:D.mem.filter(m=>m.tel==S.u.tel);
const dps=()=>{const ids=mine().map(m=>m.id);return D.dep.filter(d=>ids.includes(d.mid))};
const jour=(c,d)=>{const ids=D.mem.filter(m=>m.mgr==c.id).map(m=>m.id),ap=D.app.filter(x=>x.col==c.id&&x.date==d).reduce((a,x)=>a+x.montant,0),mi=D.dep.filter(x=>ids.includes(x.mid)&&x.date==d).reduce((a,x)=>a+x.montant,0);return{ap,mi,so:ap-mi}};
const remDe=(c,d)=>D.rem.find(r=>r.col==c.id&&r.date==d);
const recList=a=>`<div class="tb"><table><tr><th>Date</th><th>Mises</th><th>Montant</th><th></th></tr>${a.sort((x,y)=>y.date>x.date?1:-1).map(d=>`<tr><td>${d.date}</td><td>${d.n||Math.round(d.montant/(D.mem.find(m=>m.id==d.mid)||{mise:1}).mise)}</td><td>${F(d.montant)}</td><td><button class="btn s" onclick="rec('${d.id}')">Reçu</button></td></tr>`).join('')||'<tr><td colspan=4>Aucun reçu.</td></tr>'}</table></div>`;
let PH='',PS='A6',PK='',PI='';

const d=document.createElement('div');d.className='pz '+(size=='A4'?'a4':size=='A6'?'a6':'tk');d.innerHTML=h;document.body.append(d);document.body.classList.add('pzon');
const done=()=>{d.remove();document.body.classList.remove('pzon');removeEventListener('afterprint',done)};addEventListener('afterprint',done);window.print();setTimeout(done,60000)}
function box(h,sz,k,id){PH=h;PS=sz||'A6';PK=k||'';PI=id||'';const mo=document.createElement('div');mo.className='mo';mo.id='mo';mo.innerHTML=`<div class="bx">${h}<div class="row np"><button class="btn s" onclick="printDoc(PH,PS)">Imprimer</button>${k?`<button class="btn s y" onclick="pdfDoc(PK,PI)">Télécharger PDF</button>`:''}<button class="btn s o" onclick="mo.remove();dash()">Fermer</button></div></div>`;document.body.append(mo)}
const orgOf=m=>{const c=D.users.find(u=>u.id==m.mgr);return(c&&D.org&&D.org[c.adm])||{}};

const imgInfo=src=>new Promise(r=>{const i=new Image();i.onload=()=>{try{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);r({d:c.toDataURL('image/jpeg',.92),w:i.naturalWidth,h:i.naturalHeight})}catch(e){r(null)}};i.onerror=()=>r(null);i.src=src});
async function pdfDoc(kind,id){if(!window.jspdf)return alert('Module PDF non chargé. Vérifiez votre connexion internet puis réessayez.');
const J=window.jspdf.jsPDF,d=kind=='rec'?D.dep.find(x=>x.id==id):null,m=D.mem.find(x=>x.id==(d?d.mid:id)),o=orgOf(m),c=carr(m),nm=m.prenom+' '+m.nom;

:kind=='tick'?[['Tontine N°',m.sn],['Adhérent',nm],['Téléphone',m.tel],['Quartier',m.q],['Mise par jour',F(m.mise)],['Cases payées',c+'/31'],['Collecté',F(tot(m))],['État',stt(m)]]
:[['Tontine N°',m.sn],['Adhérent',nm],['Téléphone',m.tel],['Quartier',m.q],['Mise journalière',F(m.mise)],['Ouverte le',m.date],['État',stt(m)]];
const W=kind=='tick'?80:kind=='rec'?105:210,vx=W<100?34:48,est=v=>Math.max(1,Math.ceil(String(v).length*2/(W-vx-6))),H=kind=='tick'?60+rows.reduce((a,r)=>a+est(r[1])*5+1.5,0):kind=='rec'?148:297;
const p=new J({unit:'mm',format:kind=='tick'?[W,H]:kind=='rec'?'a6':'a4'}),pl=await imgInfo('logo.png'),ol=o.logo?await imgInfo(o.logo):null,cx=W/2;let y=5;
if(pl)p.addImage(pl.d,'JPEG',4,y,11*pl.w/pl.h,11);
if(ol){p.addImage(ol.d,'JPEG',cx-12*ol.w/ol.h/2,y,12*ol.w/ol.h,12);y+=15}else y+=2;
p.setFont('helvetica','bold');p.setFontSize(W<100?11:13);p.setTextColor(11,74,26);const nl=p.splitTextToSize(o.nom||'Yèrèdèmè Tontine',W-34);p.text(nl,cx,y+4,{align:'center'});y+=nl.length*5+3;

y+=2;p.setDrawColor(207,220,203);p.line(6,y,W-6,y);y+=7;p.setTextColor(20);p.setFont('helvetica','bold');p.setFontSize(12);p.text({rec:'Reçu de mise',tick:'Ticket de tontine',fiche:'Fiche de tontine'}[kind],cx,y,{align:'center'});y+=8;

if(kind=='fiche'){y+=2;const bt=m.statut=='normal'?['CLÔTURÉ ET PAYÉ',[31,138,58]]:m.statut=='interrompu'?['CLÔTURÉ INTERROMPU ET PAYÉ',[179,38,30]]:m.statut=='attente'?['CLÔTURE EN ATTENTE DE VALIDATION',[180,130,0]]:null;if(bt){p.setFont('helvetica','bold');p.setFontSize(17);p.setTextColor(bt[1][0],bt[1][1],bt[1][2]);p.text(bt[0],cx,y+6,{align:'center'});y+=13}y+=2;const cs=(W-40)/7;for(let i=0;i<31;i++){const x=20+(i%7)*cs,yy=y+Math.floor(i/7)*cs;if(i<c){p.setFillColor(31,138,58);p.rect(x,yy,cs,cs,'F');p.setTextColor(255)}else if(isCl(m)){p.setFillColor(217,217,217);p.rect(x,yy,cs,cs,'F');p.setTextColor(138)}else{p.setDrawColor(150);p.rect(x,yy,cs,cs,'S');p.setTextColor(120)}p.setFontSize(12);p.text(String(i+1),x+cs/2,yy+cs/2+1.6,{align:'center'})}
y+=Math.ceil(31/7)*cs+8;p.setTextColor(20);p.setFontSize(11);p.text('Cases payées : '+c+'/31   -   Total collecté : '+F(tot(m)),cx,y,{align:'center'})}
p.setFont('helvetica','normal');p.setFontSize(7);p.setTextColor(130);p.text('Document généré par Yèrèdèmè Tontine',cx,(kind=='tick'?H:kind=='rec'?148:297)-5,{align:'center'});
p.save(({rec:'recu',tick:'ticket',fiche:'fiche'}[kind])+'-'+(m.nom+'-'+m.prenom).replace(/[^a-zA-Z0-9]+/g,'_')+'.pdf')}
function detail(){const m=D.mem.find(x=>x.id==S.m),c=carr(m);return`<button class="btn s o np" onclick="S.m=null;dash()">Retour</button><h3 style="margin-top:12px">${esc(m.prenom+' '+m.nom)}</h3>
<div class="card">${m.photo?`<img src="${m.photo}" alt="">`:'<div class="ph"></div>'}<div><b>Carte de tontine</b> <span class="tag">N° ${m.sn}</span><br>${esc(m.prenom+' '+m.nom)}<br>${esc(m.tel)} · ${esc(m.q)}<br>Mise : ${F(m.mise)} · ${tg(m)}</div></div>
${ban(m)}<h3 style="margin-top:14px">Fiche : ${c}/31 cases</h3>${f31(c,isCl(m))}<p>Total collecté : <b>${F(tot(m))}</b></p>${recList(D.dep.filter(d=>d.mid==m.id))}
<div class="row np"><button class="btn s o" onclick="tick('${m.id}')">Ticket (A6)</button><button class="btn s o" onclick="printDoc(ficheHTML('${m.id}'),'A4')">Imprimer la fiche (A4)</button><button class="btn s y" onclick="pdfDoc('fiche','${m.id}')">Fiche en PDF (A4)</button>

function val(id){const m=D.mem.find(x=>x.id==id),tt=tot(m),sp=split(S.u.id,m),com=Math.min(sp.cm,tt),cc=Math.min(sp.cc,com),pay=Math.max(0,tt-com);
if(!confirm(`Valider la clôture ${m.dem=='normal'?'normale':'interrompue'} : collecté ${F(tt)}, commission ${F(com)} (collecteur ${F(cc)}, administrateur ${F(com-cc)}). Montant à payer : ${F(pay)}. Confirmer le paiement ?`))return;
m.statut=m.dem;D.ret.push({id:uid(),mid:id,date:T(),montant:pay,com,comCol:cc,type:m.dem,adm:S.u.id});delete m.dem;save();dash()}
function rej(id){const m=D.mem.find(x=>x.id==id);if(!confirm('Rejeter la demande ? La tontine reste en cours.'))return;m.statut='cours';delete m.dem;save();dash()}
function rapport(){const a=dps(),k={j:'journalier',m:'mensuel',a:'annuel'}[S.per],n=S.per=='j'?10:S.per=='m'?7:4,ids=mine().map(m=>m.id),r=D.ret.filter(x=>ids.includes(x.mid)&&x.date.slice(0,n)==S.day.slice(0,n));
const dd=a.filter(d=>d.date.slice(0,n)==S.day.slice(0,n)),sd=dd.reduce((s,d)=>s+d.montant,0),sr=r.reduce((s,x)=>s+x.montant,0),sc=r.reduce((s,x)=>s+x.com,0),scc=r.reduce((s,x)=>s+(x.comCol||0),0),nm=dd.reduce((s,d)=>s+(d.n||Math.round(d.montant/((D.mem.find(m=>m.id==d.mid)||{mise:1}).mise))),0);
return`<div class="row np"><select style="width:auto" onchange="S.per=this.value;dash()">${[['j','Journalier'],['m','Mensuel'],['a','Annuel']].map(o=>`<option value="${o[0]}" ${S.per==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><input type="date" style="width:auto" value="${S.day}" onchange="S.day=this.value;dash()"></div>
<h3>Rapport ${k} (${S.day.slice(0,n)})</h3><div class="st"><div><b>${nm}</b>Mises</div><div><b>${F(sd)}</b>Total déposé</div><div><b>${F(sr)}</b>Retraits remis</div><div><b>${F(mine().filter(m=>m.statut=='attente').reduce((s,m)=>s+owed(m),0))}</b>Reste à payer</div>${R=='g'?`<div><b>${F(scc)}</b>Ma commission</div>`:R=='ad'?`<div><b>${F(sc)}</b>Commissions</div><div><b>${F(scc)}</b>Part collecteurs</div><div><b>${F(sc-scc)}</b>Ma part</div>`:''}</div>
