<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Administrateur de tontine · ClickTontine</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b4a1a"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ClickTontine">
<style>
:root{--g:#0b4a1a;--g2:#e6f0e4;--y:#f9b908;--bg:#fff;--tx:#14210f;--bd:#cfdccb;--mu:#5d6f58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--g:#6fcf7f;--g2:#16281a;--bg:#0e170f;--tx:#e8f1e5;--bd:#2c4230;--mu:#9fb59a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Trebuchet MS",Verdana,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5em}
.w{max-width:960px;margin:auto;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:3px solid var(--y)}
.logo{font:700 22px Georgia,serif;color:var(--g);text-decoration:none}.logo small{display:block;font:14px "Trebuchet MS",sans-serif;color:var(--mu)}
.btn{border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--g);color:#fff;text-decoration:none;display:inline-block}
.btn.y{background:var(--y);color:#2a2000}.btn.o{background:transparent;color:var(--g);border:2px solid var(--g)}.btn.s{padding:7px 10px;font-size:14px}.btn.r{background:#b3261e}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--bd)}
.tabs button{white-space:nowrap;border:0;background:var(--g2);color:var(--tx);padding:9px 13px;border-radius:20px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--g);color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.st div{background:var(--g2);padding:12px;border-left:5px solid var(--y)}.st b{display:block;font-size:22px;color:var(--g)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx);margin:4px 0 10px}
label{font-size:14px;color:var(--mu)}
.tb{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;white-space:nowrap}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.bx{background:var(--bg);border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.f31{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.f31 i{font-style:normal;text-align:center;padding:8px 0;border:1px solid var(--bd);border-radius:4px;font-size:13px}
.f31 i.p{background:#1f8a3a;color:#fff;border-color:#1f8a3a}
.card{border:2px solid var(--g);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;background:var(--g2)}
.card img,.card .ph{width:70px;height:90px;border-radius:8px;object-fit:cover;background:var(--bd)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--y);color:#2a2000;font-size:12px}
.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
@media print{.np{display:none!important}.mo{position:static;background:none}}
.nv-g{background:var(--g2);border:1px solid var(--bd);border-radius:18px;padding:14px 14px 16px;margin-top:14px}.nv-g:first-child{margin-top:0}
.nv-gt{display:flex;align-items:center;gap:8px;margin:0 0 10px;font:700 13px "Trebuchet MS",sans-serif;color:var(--mu)}.nv-gt::before{content:"";width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--g),var(--y))}
.nv-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.nv-tile{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 12px 8px 8px;border:0;border-radius:14px;background:var(--bg);color:var(--tx);font:600 14px/1.25 "Trebuchet MS",sans-serif;text-align:left;cursor:pointer;box-shadow:0 0 0 1px var(--bd);transition:transform .15s,box-shadow .15s}
.nv-tile:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--g)}.nv-tile:active{transform:scale(.97)}
.nv-ti{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g2);font-size:19px;box-shadow:inset 0 0 0 1.5px var(--bd)}
.nv-nav{position:sticky;top:0;z-index:15;background:var(--bg);padding:6px 0 4px;margin-bottom:12px}
.nv-bar{display:flex;align-items:center;gap:8px;min-height:46px;padding:5px 0;border-bottom:1px solid var(--bd)}
.nv-b{flex:none;border:0;border-radius:10px;padding:8px 13px;font:600 13px "Trebuchet MS",sans-serif;cursor:pointer;background:var(--g);color:#fff}.nv-b.m{background:var(--g2);color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--bd)}
.nv-t{flex:1;min-width:0;margin:0;font-size:17px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nv-mnu{position:absolute;left:0;right:0;top:100%;max-height:70vh;overflow-y:auto;padding:4px 12px 14px;background:var(--bg);border-radius:0 0 16px 16px;box-shadow:0 14px 28px #0004,0 0 0 1px var(--bd)}
.nv-mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.nv-mi{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border:0;border-radius:10px;background:transparent;color:var(--tx);font:500 14px "Trebuchet MS",sans-serif;text-align:left;cursor:pointer}
.nv-mi:hover{background:var(--g2)}.nv-mi[aria-selected=true]{background:var(--g);color:#fff}.nv-mi .nv-ti{width:28px;height:28px;font-size:15px}
@media(min-width:900px){.nv-tiles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.nv-tile{min-height:92px;gap:14px;padding:14px 18px 14px 14px;font-size:16px;border-radius:18px}.nv-ti{width:52px;height:52px;font-size:26px}}
.au{position:relative;isolation:isolate;min-height:calc(100vh - 72px);padding:24px 16px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.au::before{content:"";position:absolute;inset:0;background:var(--fond) center/cover no-repeat;opacity:.2;z-index:-1}
.af{width:100%;max-width:420px;text-align:center}.af label{display:block;text-align:left}.af .row{justify-content:center}.af .mu{text-align:left}.af .btn:not(.s){width:100%}
.lgw{width:min(140px,40vw);margin:0 auto 14px}.lgw img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.28))}
.bar{position:sticky;top:0;z-index:5;background:var(--bg)}
.pz{display:none}
@media print{body.pzon>*:not(.pz){display:none!important}body.pzon .pz{display:block;--bg:#fff;--tx:#000;--bd:#888;--mu:#333;--g:#0b4a1a;--g2:#e6f0e4;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pz.a6{font-size:12px}.pz.a4 .f31 i{padding:16px 0;font-size:17px}.pz .f31 i.p{background:#1f8a3a!important;color:#fff!important}}
.plat img{height:44px;display:block}.usr{display:flex;align-items:center;gap:10px;min-width:0}.un{text-align:right;line-height:1.2;min-width:0;max-width:52vw}.un b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.un small{color:var(--mu);font-size:12px}
.tkw{max-width:300px;margin:0 auto 8px;border:1px dashed var(--mu);padding:10px;border-radius:6px;font-size:14px}.a6w{max-width:400px;margin:0 auto 8px}
@media print{.pz.tk{width:70mm;font-size:11px}}
.tag.rg{background:#b3261e;color:#fff}.tag.gn{background:#1f8a3a;color:#fff}.f31 i.x{background:#d9d9d9;color:#8a8a8a;border-color:#cfcfcf}
.ban{font:700 clamp(22px,6vw,34px)/1.1 Georgia,serif;text-align:center;padding:12px 8px;border:3px solid var(--y);border-radius:10px;margin:12px 0;color:#7a5a00;background:#fff6d6;text-transform:uppercase}.ban.gn{border-color:#1f8a3a;color:#1f8a3a;background:#e6f4ea}.ban.rg{border-color:#b3261e;color:#b3261e;background:#fbe9e7}
@media print{.pz .f31 i.x{background:#d9d9d9!important;color:#8a8a8a!important}.pz .ban{font-size:22px}}
.sw{position:relative;flex:none;width:96px;height:42px;border:0;border-radius:21px;cursor:pointer;padding:0;box-shadow:inset 0 2px 6px #0005,0 1px 0 #fff9;transition:background .25s}
.sw .kn{position:absolute;top:3px;width:36px;height:36px;border-radius:50%;background:#f1f1f1;color:#8a8a8a;font:700 11px/36px "Trebuchet MS",sans-serif;text-align:center;box-shadow:0 2px 6px #0006;transition:left .25s}
.sw.on{background:linear-gradient(90deg,#14c20a,#32e32e)}.sw.on .kn{left:57px}.sw.off{background:linear-gradient(90deg,#df960a,#fdae10)}.sw.off .kn{left:3px}
fieldset[disabled]{opacity:.45}input:disabled,select:disabled{background:#e3e3e3;cursor:not-allowed}

:root{--mu:#41563a;--tx:#0d1a0a}
@media (prefers-color-scheme:dark){:root{--mu:#c3d6bd;--tx:#f2f8ef}}
body{font-size:17px;font-weight:500;line-height:1.6;-webkit-text-size-adjust:100%}
h1,h2,h3{font-weight:700}
.mu{font-size:15.5px;font-weight:500}
label{font-size:15.5px;font-weight:600;color:var(--tx)}
input,select{font-size:17px;font-weight:500;padding:12px}
th,td{font-size:15.5px;padding:10px 8px}th{font-weight:700}
.btn{font-size:16.5px}.btn.s{font-size:15.5px;padding:9px 13px}
.tag{font-size:13.5px;font-weight:700;padding:3px 10px}
.card{font-size:16.5px}
.st div{font-size:15px;font-weight:600}.st b{font-size:24px;font-weight:800}
.f31 i{font-size:15px;font-weight:600}
.nv-b{font-size:15px}.nv-t{font-size:19px}.nv-tile{font-size:16px;font-weight:700}.nv-mi{font-size:16px;font-weight:600}.nv-gt{font-size:14px;font-weight:700}
.un b{font-weight:700}.un small{font-size:13.5px;font-weight:600}
.hero p{font-size:18px;color:var(--tx)}.sv div{font-size:16.5px}.sv b{font-size:18px}

.tag.crit{background:#c0392b;color:#fff}
.bdg{display:inline-block;background:#c0392b;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;margin-left:6px;vertical-align:middle}

.ph{display:flex;gap:8px;margin:4px 0 10px}
.ph .cc{display:flex;align-items:center;gap:6px;padding:0 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font-weight:700;white-space:nowrap}
.ph .cc svg{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.ph input{margin:0;flex:1;min-width:0}
.pw{position:relative;margin:4px 0 10px}
.pw input{margin:0;padding-right:46px}
.pw input::placeholder{color:var(--mu);opacity:.6;letter-spacing:1px}
.pw .eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:none;color:var(--mu);cursor:pointer;display:grid;place-items:center;padding:0}
.pw .eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pf{max-width:520px;margin:auto;text-align:center}
.pf-av{position:relative;width:88px;height:88px;border-radius:50%;background:var(--g);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin:6px auto 6px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--g);cursor:pointer}
.pf-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.pf-cam{position:absolute;right:-4px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:15px;box-shadow:0 1px 4px #0005}
.pf-h{margin:8px 0 4px}.pf-s{color:var(--mu);margin:0 0 6px;font-size:14px}
.pf-sec{text-align:left;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--mu);margin:18px 6px 8px}
.pf-card{text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:6px 16px 12px}
.pf-card label{display:block;font-weight:700;margin:12px 0 4px}
.pf-f{display:flex;align-items:center;gap:10px;border:2px solid var(--bd);border-radius:999px;padding:0 14px;background:var(--bg)}
.pf-f span{font-size:18px;opacity:.7}
.pf-f input{border:0;margin:0;background:transparent;padding:12px 0;outline:0;min-width:0}
.pf-f.ro{background:var(--g2)}
.pf-ok{width:24px;height:24px;border-radius:50%;background:var(--g);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.pf-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-g button{border-radius:999px;padding:14px;font:inherit;font-weight:700;background:var(--g2);color:var(--tx);cursor:pointer;border:2px solid transparent}
.pf-g button.on{background:var(--g);color:var(--bg);border-color:var(--g)}
.pf-2,.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf-b{width:100%;border-radius:999px;padding:16px;margin:18px 0 24px;font-size:17px}
.lnk{background:none;border:0;color:var(--g);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px}
textarea.ta{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx);margin:4px 0 10px;resize:vertical}
.ck{display:flex;align-items:center;gap:8px;margin:8px 0}.ck input{width:auto;margin:0}
.bell{position:relative;flex:none;width:40px;height:40px;display:grid;place-items:center;background:none;border:0;color:var(--g);cursor:pointer;padding:0}
.bell svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bell b{position:absolute;top:2px;right:0;min-width:18px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#c0392b;color:#fff;font-size:11px;line-height:18px;text-align:center}
.bellp{position:fixed;inset:0;z-index:60}
.bp-b{position:absolute;inset:0;background:#0006}
.bp-c{position:absolute;top:60px;left:8px;right:8px;max-width:420px;margin-left:auto;max-height:75vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);border-radius:14px;box-shadow:0 12px 40px #0006;overflow:hidden}
.bp-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}.bp-h b{flex:1}
.bp-x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:4px 8px}
.bp-l{overflow-y:auto}
.bp-i{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--bd);padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.bp-i.u{background:var(--g2)}.bp-i.u b::before{content:"● ";color:#c0392b}
.bp-i span{font-size:20px}.bp-i div{min-width:0}.bp-i p{margin:2px 0;font-size:14px;color:var(--mu)}.bp-i small{color:var(--mu);font-size:12px}
.sw{width:64px!important;height:30px!important;border-radius:15px!important}
.sw .kn{top:3px!important;width:24px!important;height:24px!important;font:700 9px/24px "Trebuchet MS",sans-serif!important}
.sw.on .kn{left:37px!important}.sw.off .kn{left:3px!important}

.nv-tile{min-width:0}
.nv-tile>span:last-child{min-width:0;overflow-wrap:anywhere;hyphens:manual}
@media(max-width:480px){.nv-tile{gap:8px;padding:10px 8px 10px 8px;font-size:14px}.nv-ti{width:38px;height:38px;font-size:19px}}
.bfx .plat{position:relative;z-index:2;flex:none}
.bxf{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.bxf::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(249,185,8,.22),transparent);animation:bxsw 5.5s ease-in-out infinite}
.bxf .bxn{position:absolute;right:0;top:0;height:100%;width:min(320px,100%);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 40%);mask-image:linear-gradient(90deg,transparent 0,#000 40%)}
.bxn path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bxn .bxl path{stroke:var(--g);stroke-width:1.2;opacity:.22}
.bxn .bxw path{stroke:var(--y);stroke-width:2.2;stroke-dasharray:7 55;animation:bxfl 3.2s linear infinite}
.bxn .bxw path:nth-child(2){animation-duration:4.1s;animation-delay:-1s}
.bxn .bxw path:nth-child(3){animation-duration:2.6s;animation-delay:-.5s}
.bxn .bxd circle{fill:var(--g);transform-box:fill-box;transform-origin:center;opacity:.55;animation:bxnd 2.4s ease-in-out infinite}
.bxn .bxd circle:nth-child(2){animation-delay:.4s}.bxn .bxd circle:nth-child(3){animation-delay:.8s}.bxn .bxd circle:nth-child(4){animation-delay:1.2s}.bxn .bxd circle:nth-child(5){animation-delay:1.6s}.bxn .bxd circle:nth-child(6){animation-delay:2s}
.bxi{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:flex;gap:10px}
.bxi i{position:relative;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px var(--bd),0 2px 6px rgba(11,74,26,.18);animation:bxfy 3.4s ease-in-out infinite}
.bxi i:nth-child(2){animation-delay:-.8s}.bxi i:nth-child(3){animation-delay:-1.6s}.bxi i:nth-child(4){animation-delay:-2.4s}
.bxi svg{width:17px;height:17px;fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bxi i::after{content:"";position:absolute;inset:0;border-radius:50%;animation:bxrg 3.4s ease-out infinite}
.bxi i:nth-child(2)::after{animation-delay:-.8s}.bxi i:nth-child(3)::after{animation-delay:-1.6s}.bxi i:nth-child(4)::after{animation-delay:-2.4s}
@keyframes bxfl{to{stroke-dashoffset:-248}}
@keyframes bxnd{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.9);opacity:1}}
@keyframes bxfy{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bxrg{0%{box-shadow:0 0 0 0 rgba(249,185,8,.65)}70%,100%{box-shadow:0 0 0 9px rgba(249,185,8,0)}}
@keyframes bxsw{0%{left:-40%}60%,100%{left:110%}}
@media(prefers-reduced-motion:reduce){.bxf::after,.bxn .bxw path,.bxn .bxd circle,.bxi i,.bxi i::after{animation:none}}

.bar.bfx{overflow:hidden}

.rsl{display:block;margin:14px auto 0;padding:8px 12px;background:none;border:0;color:var(--g);font:600 15px "Trebuchet MS",Verdana,sans-serif;text-decoration:underline;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rsl:focus-visible{outline:3px solid var(--y);border-radius:8px}
.nv-ti svg{width:56%;height:56%;fill:none;stroke:var(--g);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.nv-ti svg circle{fill:var(--g)}
.tnc{display:block;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--g);font-weight:700;cursor:pointer}.tnv{display:block;margin-bottom:8px}.tnv.on{box-shadow:0 0 0 2px var(--g)}

input::placeholder,textarea::placeholder{color:var(--mu);opacity:.5;font-weight:400}

addEventListener('popstate',()=>{S.view='h';S.m=null;S.menu=false;if(S.u)dash()});
const cfg=a=>Object.assign({com:1,mode:'pct',val:0,pm:'pct',pv:0,pn:30,pdur:1,ppm:'pct',ppv:0,pfm:'pct',pfv:0,pmin:0},D.cfg&&D.cfg[a]);
const split=(a,m)=>{const c=cfg(a),cm=c.com*m.mise,cc=c.mode=='fix'?c.val:Math.round(cm*c.val/100);return{cm,cc:Math.max(0,Math.min(cc,cm))}};
const colls=()=>R=='ad'?D.users.filter(u=>u.role=='g'&&u.adm==SC()):[];
const intr=(a,mt)=>{const c=cfg(a);return c.pm=='fix'?c.pv:Math.round(mt*c.pv/100)};
const loanOf=m=>D.pret.find(p=>p.mid==m.id&&p.statut=='accepte');
const mises=m=>D.dep.filter(d=>d.mid==m.id).reduce((a,d)=>a+(d.n||0),0);
const lnTerms=(a,mise,P,dur)=>{const c=cfg(a),fg=c.pfm=='fix'?c.pfv:Math.round(P*c.pfv/100),serv=dur*mise,it=c.pm=='fix'?c.pv*dur:Math.round(P*c.pv/100*dur);return{fg,net:P-fg,serv,interet:it,total:P+serv+it,nb:Math.max(1,Math.ceil((P+serv)/mise)),max:30*mise*dur}};
/* échéance au 31e jour : on compte à partir de la date de la première mise (pas du mois civil) */
const addJ=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10),
loanFin=p=>{if(p.statut!='accepte'||!p.dateDec||(p.pen||0)>0)return;const f=D.dep.filter(d=>d.mid==p.mid&&d.date>=p.dateDec).map(d=>d.date).sort()[0]||p.dateDec,n=addJ(f,31*(p.dur||1)-1);if(p.fin!=n)p.fin=n},
ficheFin=m=>{const L=D.dep.filter(d=>d.mid==m.id).map(d=>d.date).sort();return L.length?`<br>1re mise : ${L[0]} · 31 mises à terminer au plus tard le ${addJ(L[0],30)}`:''};
const penUpd=p=>{loanFin(p);if(p.statut!='accepte'||!p.fin||T()<=p.fin)return;const c=cfg(p.adm),ml=Math.ceil(Math.floor((new Date(T())-new Date(p.fin))/864e5)/31),base=Math.max(0,p.total-p.rembourse),pen=c.ppm=='fix'?c.ppv*ml:Math.round(base*c.ppv/100*ml);if(pen>(p.pen||0))p.pen=pen};
D.pret.forEach(p=>loanFin(p));
const due=p=>{penUpd(p);return Math.max(0,p.total+(p.pen||0)-p.rembourse)};
const instAmt=(p,i)=>i<p.nb?p.mise:i==p.nb?p.total+(p.pen||0)-(p.nb-1)*p.mise:p.mise;
const lnPlan=(m,n)=>{const p=loanOf(m);if(!p)return null;let k=p.k||0,left=due(p),rep=0;for(let i=1;i<=n&&left>0;i++){k++;const a=Math.min(Math.max(1,instAmt(p,k)),left);rep+=a;left-=a}
const pa=p.rembourse+rep,pp=Math.max(0,Math.min(p.pen||0,pa-p.total))-Math.max(0,Math.min(p.pen||0,p.rembourse-p.total));return{p,rep,k,pp}};
const lnRep=(m,n)=>{const q=lnPlan(m,n);return q?q.rep:0};
const lnInfo=(m,n)=>{const p=loanOf(m);return p?`<br>Prêt ${p.sn} : reste ${F(due(p))}<br>Remboursement : ${F(lnRep(m,n))}<br><b>Total à encaisser : ${F(n*m.mise+lnRep(m,n))}</b>`:''};
const pTag=p=>`<span class="tag ${p.statut=='refuse'?'rg':p.statut=='accepte'||p.statut=='solde'?'gn':''}">${{demande:'En attente de validation',accepte:'Accepté · en cours',refuse:'Refusé',solde:'Soldé'}[p.statut]}</span>`;
const pCard=p=>{penUpd(p);const m=D.mem.find(x=>x.id==p.mid),ok=p.statut=='accepte'||p.statut=='solde',tt=p.total+(p.pen||0),pc=Math.min(100,Math.round(p.rembourse*100/tt)),x=p.mise||Math.ceil(p.total/p.nb),net=p.net==null?p.montant:p.net;
return`<div class="card" style="display:block;margin-bottom:10px"><b>${p.sn}</b> ${pTag(p)}<p class="mu">${esc(m.prenom+' '+m.nom)} (${m.sn}) · Demandé le ${p.dateDem}<br>Montant : <b>${F(p.montant)}</b> · Durée : ${p.dur||1} mois${p.fg?` · Frais de gestion : ${F(p.fg)}`:''}<br>Net remis : <b>${F(net)}</b><br>Intérêt : ${F(p.interet)}${p.serv?` · Mise de service : ${F(p.serv)}`:''} · Total à rembourser : <b>${F(p.total)}</b><br>Échéance : ${F(x)} par mise (${p.nb} échéances, dernière : ${F(p.total-(p.nb-1)*x)})<br>Motif : ${esc(p.motif)}${ok?`<br>Remboursé : ${F(p.rembourse)} (${p.k||0}/${p.nb} échéances) · Reste : <b>${F(Math.max(0,tt-p.rembourse))}</b>`:''}${p.pen?`<br>Pénalité de retard : <b style="color:#b3261e">${F(p.pen)}</b>`:''}${p.statut=='accepte'&&p.fin?`<br>À solder avant le ${p.fin}${T()>p.fin?' <b style="color:#b3261e">(en retard)</b>':''}`:''}${p.avis?`<br>Avis de l'administrateur : ${esc(p.avis)}`:''}</p>${ok?`<div style="height:8px;background:var(--bd);border-radius:4px"><div style="width:${pc}%;height:8px;background:#1f8a3a;border-radius:4px"></div></div>`:''}</div>`};
const noticeP=()=>{if(!pretVis())return'';const ids=mine().map(m=>m.id);return D.pret.filter(p=>ids.includes(p.mid)&&p.statut!='demande'&&!p.vu).map(p=>`<div class="ban ${p.statut=='refuse'?'rg':'gn'}" style="font-size:18px;text-transform:none;margin:0 0 12px">Votre demande de prêt ${p.sn} de ${F(p.montant)} a été ${p.statut=='refuse'?'refusée':'acceptée'}.<br><button class="btn s" onclick="nav('pt')">Voir le détail</button></div>`).join('')};

const comRows=c=>{const ids=D.mem.filter(m=>m.mgr==c.id).map(m=>m.id);return D.ret.filter(r=>ids.includes(r.mid)&&(r.comCol||0)>0).concat(D.gret.filter(r=>r.mgr==c.id&&(r.comCol||0)>0))};

function xl(sheets,fname){if(!window.XLSX)return alert('Module Excel non chargé. Vérifiez votre connexion internet puis réessayez.');const wb=XLSX.utils.book_new();sheets.forEach(s=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(s.rows),s.n.slice(0,31)));XLSX.writeFile(wb,fname+'.xlsx')}

function recPay(id){const r=D.ret.find(x=>x.id==id),m=D.mem.find(x=>x.id==r.mid);box(`<div class="a6w">${docHead(m)}<h3 style="text-align:center;margin:6px 0">Reçu de paiement</h3><p>Reçu N° ${r.id.slice(-6).toUpperCase()}<br>Tontine N° : <b>${m.sn}</b><br>Date : ${r.date}<br>Bénéficiaire : <b>${esc(m.prenom+' '+m.nom)}</b><br>Tél : ${esc(m.tel)} · Quartier : ${esc(m.q)}<br>Type : ${r.type=='normal'?'Clôture normale':'Clôture interrompue'}<br>Total collecté : ${F(tot(m))}<br>Commission retenue : ${F(r.com)}<br>Montant payé : <b>${F(r.montant)}</b></p><p class="mu" style="margin-top:18px">Signature du bénéficiaire : ______________</p></div>`,'A6','rec',id)}
const pretOn=a=>{const c=D.cfg&&D.cfg[a];return c&&c.pret!==undefined?c.pret:D.pret.some(p=>p.adm==a)};
const pretVis=()=>R=='ad'?pretOn(SC()):R=='g'?pretOn(S.u.adm):R=='a'?mine().some(m=>{const c=D.users.find(u=>u.id==m.mgr);return c&&pretOn(c.adm)}):false;
/* ===== Tontine groupe : mois de 31 jours, 1 tour par mois, mise commune ===== */
const GDAYS=31,GTYP={sort:'Tirage au sort',ordre:"Ordre d'inscription",exc:'Tour exceptionnel'};
D.gret=D.gret||[];
D.grp.forEach(g=>{if(g.mem.length&&typeof g.mem[0]=='string'){g.mem=g.mem.map(id=>{const m=D.mem.find(k=>k.id==id)||{};return{id,nom:m.nom||'?',prenom:m.prenom||'',tel:m.tel||'',q:m.q||'',montant:g.c||0,photo:m.photo||'',main:1}})}g.hist=g.hist||[];g.dep=g.dep||[];g.exc=g.exc||[];g.done=g.done||[];g.mains=g.mains||'sep';if(g.montant==null)g.montant=g.mem.length?g.mem[0].montant:0;if(!g.cyc)g.cyc=g.hist.length+1;g.hist.forEach(t=>{if(!t.hs)t.hs=[t.h];if(!t.k)t.k=1;if(!t.nb)t.nb=1;if(!t.st)t.st='paye'})});
const grpOn=a=>{const c=D.cfg&&D.cfg[a];return !!(c&&c.grp)};
const gSC=()=>R=='ad'?(typeof SC=='function'?SC():S.u.id):R=='g'?S.u.adm:'';
const gAdmOf=x=>{const c=D.users.find(u=>u.id==x.mgr);return c?c.adm:''};
const gMine=()=>R=='g'?D.grp.filter(x=>x.mgr==S.u.id):R=='ad'?D.grp.filter(x=>colls().some(c=>c.id==x.mgr)):R=='a'?D.grp.filter(x=>x.mem.some(h=>h.tel==S.u.tel)):[];
const gRetMine=()=>D.gret.filter(r=>R=='g'?r.mgr==S.u.id:R=='ad'?colls().some(c=>c.id==r.mgr):false);
const grpVis=()=>R=='ad'?grpOn(gSC()):R=='g'?grpOn(S.u.adm):R=='a'?(gMine().some(x=>grpOn(gAdmOf(x)))||mine().some(m=>{const c=D.users.find(u=>u.id==m.mgr);return c&&grpOn(c.adm)})):false;
const gF=id=>D.grp.find(g=>g.id==id);
const gAmt=(x,d)=>d.m!=null?d.m:d.n*((x.mem.find(h=>h.id==d.h)||{}).montant||0);
const gUv=(cid,d)=>D.grp.filter(g=>g.mgr==cid).reduce((a,g)=>a+g.dep.filter(p=>p.date==d).reduce((s,p)=>s+gAmt(g,p),0),0);
const gPotC=(x,c)=>x.dep.filter(d=>(d.c||1)==c).reduce((a,d)=>a+gAmt(x,d),0);
const gPotTheo=x=>x.mem.reduce((a,h)=>a+h.montant*GDAYS,0);
const gCases=(x,h,c)=>Math.min(GDAYS,x.dep.filter(d=>d.h==h.id&&(d.c||1)==(c||x.cyc)).reduce((a,d)=>a+d.n,0));
const gCovered=(x,c)=>x.hist.find(t=>t.k<c&&c<t.k+t.nb);
const gRestH=x=>x.mem.filter(h=>!x.done.includes(h.id));
const gBundle=(x,h)=>x.mains=='ens'?gRestH(x).filter(k=>k.tel==h.tel):[h];
const gRule=a=>{const c=cfg(a);return{mode:c.gmode=='pct'?'pct':'mise',val:Math.max(0,Math.min(100,+c.gval||0))}};
const gRuleTxt=a=>{const r=gRule(a);return r.mode=='pct'?`Retenue : ${r.val} % de la cagnotte est retenu sur chaque tour.`:"Retenue : une mise (celle de la main bénéficiaire) est retenue sur chaque main."};
function gRet(x,hs,pot){const a=gAdmOf(x),r=gRule(a),c=cfg(a);let ret=r.mode=='pct'?Math.round(pot*r.val/100):hs.reduce((s,h)=>s+h.montant,0);ret=Math.max(0,Math.min(ret,pot));const cc=c.mode=='fix'?c.val:Math.round(ret*c.val/100);return{ret,cc:Math.max(0,Math.min(cc,ret)),net:pot-ret}}
const gNm=h=>esc(h.prenom+' '+h.nom)+(h.main>1?' (main '+h.main+')':'');
const gPh=h=>h.photo?`<img src="${h.photo}" alt="" style="width:36px;height:46px;object-fit:cover;border-radius:4px">`:'';
const gWin=(x,e)=>x.mem.find(h=>h.id==e.h)||{prenom:'?',nom:'',tel:''};
const gWins=(x,t)=>(t.hs||[t.h]).map(i=>x.mem.find(h=>h.id==i)).filter(Boolean).map(gNm).join(' + ');
const gMois=t=>t.nb>1?t.k+'–'+(t.k+t.nb-1):String(t.k);
const gEtat=t=>t.st=='report'?'Cagnotte à calculer':t.st=='tirage'?'Tour effectué':t.st=='attente'?'Clôture en attente de validation':'Payé';
const gHead=a=>`<p class="mu">La tontine groupe fonctionne par mois de ${GDAYS} jours : chaque main verse la même mise chaque jour (${GDAYS} cases) et, à la fin du mois, un seul tour a lieu : la cagnotte du mois est remise à un membre. La mise commune et la règle des membres à deux mains sont fixées au début. ${gRuleTxt(a)} Le paiement se fait par clôture validée par l'administrateur, comme la tontine individuelle.</p>`;
const gMainsTxt=x=>x.mains=='ens'?'Membre à deux mains : reçoit les deux d\'un coup (avance d\'un mois possible au tirage)':'Membre à deux mains : reçoit une main par tour';
const gHist=(x,mode)=>{const L=x.hist.map((e,i)=>({e,i})).filter(o=>mode=='m'?o.e.inf:true);if(!L.length)return'<p class="mu">Aucun tour à afficher pour le moment.</p>';
return`<div class="tb"><table><tr><th>Tour</th><th>Mois</th><th>Date</th><th>Bénéficiaire</th><th>Type</th><th>Cagnotte</th><th>Retenue</th><th>Reçoit</th><th>État</th>${mode!='a'?'<th></th>':''}</tr>${L.map(({e,i})=>`<tr><td>${i+1}</td><td>${gMois(e)}</td><td>${e.date}</td><td><b>${gWins(x,e)}</b></td><td>${GTYP[e.type]||'Tour'}${e.adv?' · avance':''}</td><td>${e.st=='report'?'—':F(e.montant)}</td><td>${e.st=='report'?'—':F(e.ret||0)}</td><td><b>${e.st=='report'?'—':F(e.net!=null?e.net:e.montant)}</b></td><td>${gEtat(e)}</td>${mode!='a'?`<td><div class="row np">${mode=='c'?(e.inf?'<span class="mu">Informé le '+e.infDate+'</span>':`<button class="btn s y" onclick="gInform('${x.id}',${i})">📣 Informer</button>`)+(e.st=='tirage'?`<button class="btn s" onclick="gClose('${x.id}',${i})">Clôturer et demander le paiement</button>`:''):''}${e.rid?`<button class="btn s o" onclick="gRec('${e.rid}')">Reçu</button>`:''}</div></td>`:''}</tr>`).join('')}</table></div>`};
function gNotify(x,fn){D.notif=D.notif||[];const seen={},miss=[];let sent=0;x.mem.forEach(h=>{if(seen[h.tel])return;seen[h.tel]=1;const m=fn(h.tel);if(!m)return;const u=D.users.find(k=>k.role=='a'&&k.tel==h.tel);if(u){D.notif.push({id:uid(),uid:u.id,t:m[0],x:m[1],d:T(),tab:'gr',ic:m[2]});sent++}else miss.push(h.prenom+' '+h.nom+' ('+h.tel+')')});return{sent,miss}}
function gNotifyNew(x){gNotify(x,t=>['Tontine groupe : vous êtes inscrit(e)',"Vous faites partie du groupe "+x.nom+" ("+x.sn+") : mise commune de "+F(x.montant)+" par jour, un tour par mois. Suivez votre fiche et les tours dans l'onglet Tontine groupe.",'🔄'])}
/* --- mises (liées au portefeuille UV du collecteur) --- */
function gUvOk(a){const j=jour(S.u,T());if(remDe(S.u,T())){alert("La journée d'aujourd'hui est déjà remise à l'administrateur.");return false}if(a>j.so-j.rq){alert('Solde UV insuffisant ('+F(j.so-j.rq)+'). Demandez un approvisionnement à votre administrateur.');return false}return true}
function gPay(id,hid){const x=gF(id),h=x.mem.find(k=>k.id==hid);if(gCases(x,h)>=GDAYS)return alert('La fiche du mois est complète pour cette main ('+GDAYS+' mises).');if(!gUvOk(h.montant))return;x.dep.push({id:uid(),h:hid,date:T(),n:1,m:h.montant,c:x.cyc});save();dash()}
function gUndo(id,hid){const x=gF(id),i=x.dep.map(d=>d.h==hid&&(d.c||1)==x.cyc).lastIndexOf(true);if(i<0)return alert('Aucune mise à annuler ce mois-ci.');if(remDe(S.u,x.dep[i].date))return alert('Cette journée est déjà remise à l\'administrateur.');if(!confirm('Annuler la dernière mise enregistrée pour cette main ?'))return;const d=x.dep[i];if(d.n>1){d.n--;d.m=(d.m||0)-d.m/(d.n+1)}else x.dep.splice(i,1);save();dash()}
function gPayAll(id){const x=gF(id),L=x.mem.filter(h=>gCases(x,h)<GDAYS);if(!L.length)return alert('Toutes les fiches du mois sont complètes.');const tt=L.reduce((a,h)=>a+h.montant,0);if(!gUvOk(tt))return;if(!confirm("Enregistrer 1 mise aujourd'hui pour "+L.length+" main(s) ("+F(tt)+") ?"))return;L.forEach(h=>x.dep.push({id:uid(),h:h.id,date:T(),n:1,m:h.montant,c:x.cyc}));save();dash()}
/* --- tour du mois : tirage, ordre d'inscription ou exceptionnel --- */
function gDraw(id,type,hid){const x=gF(id),rest=gRestH(x);if(!rest.length)return alert('Tous les membres ont reçu : groupe terminé.');const c=x.cyc;if(gCovered(x,c))return alert("Ce mois est couvert par le tour d'un membre à deux mains : utilisez « Clôturer le mois ».");
const cand=x.mains=='ens'?[...new Map(rest.map(h=>[h.tel,h])).values()]:rest;
const w=type=='sort'?cand[Math.floor(Math.random()*cand.length)]:type=='ordre'?cand[0]:rest.find(h=>h.id==hid);if(!w)return alert('Bénéficiaire introuvable.');
const hs=gBundle(x,w),nb=hs.length,inc=x.mem.filter(h=>gCases(x,h,c)<GDAYS).length,nm=hs.map(h=>h.prenom+' '+h.nom+(h.main>1?' (main '+h.main+')':'')).join(' + ');const adv=nb>1&&!!($('adv_'+id)&&$('adv_'+id).checked);let pot=0,r={ret:0,cc:0,net:0};if(nb==1||adv){pot=gPotC(x,c)*nb;r=gRet(x,hs,pot)}
if(!confirm(`Mois ${c} — ${GTYP[type]}\nBénéficiaire : ${nm}\n`+(nb==1||adv?`Cagnotte${adv?' (avance d\'un mois incluse)':' collectée'} : ${F(pot)} · retenue : ${F(r.ret)}\nMontant à remettre : ${F(r.net)}`+(adv?`\nLes deux mains sont payées dès ce mois ; la cagnotte du mois ${c+1} rembourse l'avance.`:''):`Deux mains reçues d'un coup : la cagnotte sera calculée à la fin du mois ${c+nb-1} (mois ${c} à ${c+nb-1}).`)+(inc?`\n\nAttention : ${inc} main(s) n'ont pas fini leurs ${GDAYS} mises ce mois-ci (clôture interrompue).`:'')+`\n\nConfirmer ?`))return;
const t={id:uid(),k:c,nb,hs:hs.map(h=>h.id),h:hs[0].id,date:T(),type,inf:false,cmp:inc==0,montant:pot,ret:r.ret,retCol:r.cc,net:r.net,st:nb==1||adv?'tirage':'report',adv,avance:adv?gPotC(x,c):0};

<p class="mu">La part de l'administrateur est le reste de la commission.</p><div class="row" style="align-items:center;justify-content:space-between;margin-top:22px"><h3 style="margin:0">Paramètre prêts</h3><button type="button" id="swp" class="sw ${pretOn(SC())?'on':'off'}" role="switch" aria-checked="${pretOn(SC())}" aria-label="Activer les prêts" onclick="togPret()"><span class="kn">${pretOn(SC())?'ON':'OFF'}</span></button></div><p class="mu" id="pst">${pretOn(SC())?'Prêts activés : les onglets Prêts sont visibles pour tout le monde.':'Prêts désactivés : les onglets Prêts sont masqués et les réglages ci-dessous sont grisés.'}</p><fieldset id="pfs" ${pretOn(SC())?'':'disabled'} style="border:0;padding:0;margin:0"><label>Durée maximale d'un prêt (mois)</label><input id="pdu" type="number" min="1" max="12" value="${c.pdur}">
<label>Taux d'intérêt (par mois, ajouté à la dernière échéance)</label><select id="pmo"><option value="pct" ${c.pm=='pct'?'selected':''}>Pourcentage (%)</option><option value="fix" ${c.pm=='fix'?'selected':''}>Montant fixe (GNF)</option></select><input id="pv" inputmode="numeric" value="${nf(c.pv)}" oninput="fmtI(this)">
<label>Pénalité de retard (par mois de retard sur le reste dû)</label><select id="ppo"><option value="pct" ${c.ppm=='pct'?'selected':''}>Pourcentage (%)</option><option value="fix" ${c.ppm=='fix'?'selected':''}>Montant fixe (GNF)</option></select><input id="ppv" inputmode="numeric" value="${nf(c.ppv)}" oninput="fmtI(this)">
<label>Frais de gestion (retenus sur le montant remis)</label><select id="pfo"><option value="pct" ${c.pfm=='pct'?'selected':''}>Pourcentage (%)</option><option value="fix" ${c.pfm=='fix'?'selected':''}>Montant fixe (GNF)</option></select><input id="pfv" inputmode="numeric" value="${nf(c.pfv)}" oninput="fmtI(this)">
<label>Nombre de mises à effectuer avant de bénéficier d'un prêt</label><input id="pmn" type="number" min="0" value="${c.pmin}">
<p class="mu">Exemple (mise de 20 000 GNF, prêt d'un mois) : prêt maximum ${F(lnTerms(SC(),20000,600000,1).max)}, frais de gestion ${F(lnTerms(SC(),20000,600000,1).fg)}, net remis ${F(lnTerms(SC(),20000,600000,1).net)}, total à rembourser ${F(lnTerms(SC(),20000,600000,1).total)} en ${lnTerms(SC(),20000,600000,1).nb} mises de 20 000 (intérêts inclus dans la dernière échéance). Le client paie sa mise de tontine en plus.</p></fieldset><div class="row" style="align-items:center;justify-content:space-between;margin-top:22px"><h3 style="margin:0">Paramètre tontine groupe</h3><button type="button" id="swg" class="sw ${grpOn(SC())?'on':'off'}" role="switch" aria-checked="${grpOn(SC())}" aria-label="Activer la tontine groupe" onclick="togGrp()"><span class="kn">${grpOn(SC())?'ON':'OFF'}</span></button></div><p class="mu" id="gst">${grpOn(SC())?"Tontine groupe activée : l'onglet est visible pour vos collecteurs et vos clients.":"Tontine groupe désactivée : l'onglet est masqué et le réglage ci-dessous est grisé."}</p><fieldset id="gfs" ${grpOn(SC())?'':'disabled'} style="border:0;padding:0;margin:0"><label>Retenue sur la tontine groupe</label><select id="gmo"><option value="mise" ${(c.gmode||'mise')=='mise'?'selected':''}>Une mise retenue sur chaque main</option><option value="pct" ${c.gmode=='pct'?'selected':''}>Taux (%) retenu sur la cagnotte</option></select><label>Taux sur la cagnotte (%), utilisé si « Taux » est choisi</label><input id="gv" inputmode="decimal" value="${c.gval||0}"><p class="mu">Un tour par mois (31 jours), mise commune par jour fixée par le collecteur à la création du groupe. Exemple (5 mains à 20 000 GNF par jour, cagnotte du mois de 3 100 000 GNF) : retenue ${F(c.gmode=='pct'?Math.round(3100000*Math.min(100,+c.gval||0)/100):20000)} par tour.</p></fieldset><button class="btn" onclick="savePa()">Enregistrer</button>
<p class="mu">Exemple pour un client qui mise 10 000 GNF : commission ${F(split(SC(),{mise:10000}).cm)}, dont collecteur ${F(split(SC(),{mise:10000}).cc)} et administrateur ${F(split(SC(),{mise:10000}).cm-split(SC(),{mise:10000}).cc)}.</p><p class="mu">Abonnement actif jusqu'au ${S.u.exp}.</p>`}};
/* ===== Tarification, paiements et facturation ===== */
const tc=()=>Object.assign({emet:'ClickTontine',adr:'',tel:'',instr:''},D.tcfg||{}),PST={attente:'En attente',ok:'Validé',refuse:'Refusé'},
adN=id=>{const o=(D.org||{})[id],u=D.users.find(x=>x.id==id);return(o&&o.nom)||(u&&u.nom)||'?'};
function notif(to,t,x,tab,ic){(D.notif=D.notif||[]).push({id:uid(),uid:to,t,x:x||'',d:T(),tab:tab||'',ic:ic||'🔔'});if(D.notif.length>600)D.notif.splice(0,D.notif.length-600)}
function mkFac(ab,plan,mode,ref,du,au){const y=String(ab.date).slice(0,4),n=(D.fac||[]).filter(f=>f.num.slice(4,8)==y).length+1,f={id:uid(),num:'FAC-'+y+'-'+String(n).padStart(4,'0'),adm:ab.adm,aboId:ab.id,date:ab.date,plan,mois:ab.mois,montant:ab.montant,mode:mode||'',ref:ref||'',du:du||'',au:au||''};(D.fac=D.fac||[]).push(f);return f}
function encaisse(id,n,mt,plan,mode,ref){const u=D.users.find(x=>x.id==id),base=u.exp&&u.exp>T()?u.exp:T();u.actif=true;u.exp=addMo(base,n);const ab={id:uid(),adm:id,date:T(),mois:n,montant:mt};D.abo.push(ab);const f=mt>0?mkFac(ab,plan,mode,ref,base,u.exp):null;
notif(id,'Abonnement activé',"Valable jusqu'au "+u.exp+(f?'. Facture '+f.num+' disponible.':''),f?'fc':'tf','✅');return f}
const tPrix=(p,n)=>p.par?p.prix*Math.max(1,n)*(p.fact||p.mois):p.prix,
tNbCol=a=>D.users.filter(c=>c.role=='g'&&tIds(a).includes(c.adm)).length,
tOk=(p,n)=>!p.par||(Math.max(1,n)>=(p.cmin||1)&&(p.cmax==null||Math.max(1,n)<=p.cmax));
function tLim(id,pid){const u=D.users.find(k=>k.id==id),p=(D.tar||[]).find(t=>t.id==pid);if(!u)return;if(p&&p.par){u.maxCl=p.maxCl==null?null:p.maxCl;u.cmax=p.cmax==null?null:p.cmax;u.plan=p.nom}else{delete u.maxCl;delete u.cmax;delete u.plan}}
const tfX=(k,p)=>`<label class="ck"><input type="checkbox" id="tpar_${k}" ${p.par?'checked':''}> Prix par collecteur et par mois (le prix ci-dessus est celui d'un collecteur pour un mois)</label><div class="g2"><div><label>Mois facturés (ex. 10 pour 12 mois)</label><input id="tf_${k}" type="number" min="1" max="36" value="${p.fact||p.mois||1}"></div><div><label>Clients max (vide = illimité)</label><input id="tcl_${k}" type="number" min="1" value="${p.maxCl==null?'':p.maxCl}"></div></div><div class="g2"><div><label>Collecteurs min</label><input id="tc1_${k}" type="number" min="1" value="${p.cmin||1}"></div><div><label>Collecteurs max (vide = illimité)</label><input id="tc2_${k}" type="number" min="1" value="${p.cmax==null?'':p.cmax}"></div></div>`;
(function(){if(D.tarV2)return;D.tarV2=1;D.tar=D.tar||[];D.tar.forEach(p=>p.actif=false);const o=(nom,mois,fact,prix,cmin,cmax,maxCl)=>D.tar.push({id:uid(),nom,mois,fact,prix,par:1,cmin,cmax,maxCl,actif:true});
o('Un seul collecteur · mensuel',1,1,80000,1,1,100);o('Un seul collecteur · annuel (2 mois offerts)',12,10,80000,1,1,100);o('Réseau Standard · mensuel',1,1,60000,2,5,null);o('Réseau Standard · annuel (2 mois offerts)',12,10,60000,2,5,null);o('Grand Réseau · mensuel',1,1,45000,6,null,null);o('Grand Réseau · annuel (2 mois offerts)',12,10,45000,6,null,null);save()})();
/* --- Tarification --- */
function tfView(){return R=='sa'?tfSa():tfAd()}
function tfSa(){const P=D.tar||[],c=tc();
return`<h3>Tarifs d'abonnement des administrateurs de tontine</h3><p class="mu">Ce sont les tarifs que voient les administrateurs de tontine. Seules les offres cochées « visible » leur sont proposées.</p>
${P.map(p=>`<div class="card" style="display:block;margin-bottom:10px"><label>Nom de l'offre</label><input id="tn_${p.id}" value="${esc(p.nom)}"><div class="g2"><div><label>Durée (mois)</label><input id="tm_${p.id}" type="number" min="1" max="36" value="${p.mois}"></div><div><label>Prix (GNF) : par collecteur et par mois si coché plus bas</label><input id="tp_${p.id}" inputmode="numeric" value="${fmN(p.prix)}" oninput="fmtI(this)"></div></div>${tfX(p.id,p)}<label class="ck"><input type="checkbox" id="ta_${p.id}" ${p.actif?'checked':''}> Visible par les administrateurs</label><div class="row"><button class="btn s" onclick="tarSave('${p.id}')">Enregistrer</button><button class="btn s r" onclick="tarDel('${p.id}')">Supprimer</button></div></div>`).join('')||'<p class="mu">Aucune offre pour le moment.</p>'}
<h3 style="margin-top:20px">Ajouter une offre</h3><label>Nom de l'offre</label><input id="tn_new" placeholder="Ex : Abonnement 3 mois"><div class="g2"><div><label>Durée (mois)</label><input id="tm_new" type="number" min="1" max="36" value="1"></div><div><label>Prix (GNF)</label><input id="tp_new" inputmode="numeric" placeholder="0" oninput="fmtI(this)"></div></div>${tfX('new',{par:1,fact:1,cmin:1,cmax:null,maxCl:null})}<button class="btn" onclick="tarAdd()">Ajouter l'offre</button>
<h3 style="margin-top:24px">Coordonnées de paiement et de facturation</h3><label>Nom de l'émetteur des factures</label><input id="tc_e" value="${esc(c.emet)}"><label>Adresse</label><input id="tc_a" value="${esc(c.adr)}"><label>Téléphone</label><input id="tc_t" value="${esc(c.tel)}"><label>Instructions de paiement (affichées aux administrateurs)</label><textarea class="ta" id="tc_i" rows="3" placeholder="Ex : Orange Money au numéro ... ; MTN MoMo au numéro ...">${esc(c.instr)}</textarea><button class="btn" onclick="tcSave()">Enregistrer</button>`}
function tarRead(k){const nom=$('tn_'+k).value.trim(),mois=Math.floor(+$('tm_'+k).value),prix=num($('tp_'+k).value);if(!nom)return alert("Donnez un nom à l'offre."),null;if(!(mois>=1&&mois<=36))return alert('La durée doit être comprise entre 1 et 36 mois.'),null;if(!(prix>0))return alert('Saisissez un prix supérieur à 0.'),null;const par=$('tpar_'+k).checked,fact=Math.floor(+$('tf_'+k).value)||mois,cmin=Math.max(1,Math.floor(+$('tc1_'+k).value)||1),cm=$('tc2_'+k).value.trim(),cmax=cm===''?null:Math.max(cmin,Math.floor(+cm)),mc=$('tcl_'+k).value.trim(),maxCl=mc===''?null:Math.max(1,Math.floor(+mc));if(fact>mois)return alert('Les mois facturés ne peuvent pas dépasser la durée.'),null;return{nom,mois,prix,par:par?1:0,fact,cmin,cmax,maxCl}}
function tarAdd(){const r=tarRead('new');if(!r)return;(D.tar=D.tar||[]).push(Object.assign({id:uid(),actif:true},r));save();dash()}
function tarSave(id){const r=tarRead(id);if(!r)return;const p=D.tar.find(x=>x.id==id);Object.assign(p,r,{actif:$('ta_'+id).checked});save();alert('Offre enregistrée.');dash()}
function tarDel(id){if(!confirm('Supprimer cette offre ? Les factures déjà émises ne sont pas modifiées.'))return;D.tar=D.tar.filter(x=>x.id!=id);save();dash()}
function tcSave(){D.tcfg={emet:$('tc_e').value.trim()||'ClickTontine',adr:$('tc_a').value.trim(),tel:$('tc_t').value.trim(),instr:$('tc_i').value.trim()};save();alert('Coordonnées enregistrées.');dash()}
const payForm=p=>`<label>Mode de paiement</label><select id="pm_m"><option>Orange Money</option><option>MTN Mobile Money</option><option>Espèces</option><option>Virement</option><option>Autre</option></select><label>Référence de la transaction</label><input id="pm_r" placeholder="Numéro de transaction ou de reçu"><div class="row"><button class="btn s" onclick="tarSend('${p.id}')">Envoyer ma demande de paiement</button><button class="btn s o" onclick="S.tp='';dash()">Annuler</button></div>`;
function tfAd(){const u=S.u,td=T(),P=(D.tar||[]).filter(p=>p.actif),nc=tNbCol(u.id),c=tc(),my=(D.dpay||[]).filter(x=>x.adm==u.id).sort((a,b)=>b.ts-a.ts),pend=my.some(x=>x.statut=='attente'),j=u.exp?ndiff(td,u.exp):null,st=!u.actif?(u.exp?'Suspendu':"En attente d'activation"):j<0?'Expiré':u.essai?'Essai gratuit':'Actif';
return`<h3>Mon abonnement</h3><div class="st"><div><b>${st}</b>État</div><div><b>${u.exp||'—'}</b>Valable jusqu'au</div><div><b>${j==null?'—':j<0?'Expiré':j+' j'}</b>Jours restants</div></div>${u.essai?'<p class="mu">Essai gratuit : 20 clients maximum.</p>':u.maxCl!=null?`<p class="mu">Votre offre : ${u.maxCl} clients maximum.</p>`:''}
<h3>Tarifs</h3>${c.instr?`<div class="card" style="display:block;margin-bottom:10px"><b>Comment payer</b><p style="margin:6px 0">${esc(c.instr).replace(/\n/g,'<br>')}</p></div>`:''}
${pend?"<p class=\"mu\"><b>Une demande de paiement est en attente de validation.</b> Vous pourrez en envoyer une nouvelle dès qu'elle sera traitée.</p>":''}
${P.map(p=>`<div class="card" style="display:block;margin-bottom:10px"><b>${esc(p.nom)}</b> <span class="tag">${p.mois} mois</span><p style="margin:6px 0;font-size:20px"><b>${F(tPrix(p,nc))}</b>${p.par?` <span class="mu">(${nc||1} collecteur(s) × ${F(p.prix)} × ${p.fact||p.mois} mois${(p.fact||p.mois)<p.mois?', '+(p.mois-(p.fact||p.mois))+' mois offerts':''})</span>`:p.mois>1?` <span class="mu">(${F(Math.round(p.prix/p.mois))} par mois)</span>`:''}</p>${p.par?`<p class="mu">${p.maxCl!=null?p.maxCl+' clients maximum':'Clients illimités'} · ${p.cmax==p.cmin?'1 collecteur':p.cmax==null?'plus de '+(p.cmin-1)+' collecteurs':p.cmin+' à '+p.cmax+' collecteurs'}</p>`:''}${!tOk(p,nc)?`<p class="mu">Cette offre ne correspond pas à votre nombre de collecteurs (${nc}).</p>`:S.tp==p.id&&!pend?payForm(p):`<button class="btn s" ${pend?'disabled':''} onclick="S.tp='${p.id}';dash()">Souscrire / Renouveler</button>`}</div>`).join('')||"<p class=\"mu\">Aucun tarif n'est publié pour le moment. Contactez l'administration.</p>"}
<h3 style="margin-top:20px">Mes demandes de paiement</h3>${my.length?`<div class="tb"><table><tr><th>Date</th><th>Offre</th><th>Montant</th><th>État</th></tr>${my.map(x=>`<tr><td>${x.date}</td><td>${esc(x.nom)}</td><td>${F(x.montant)}</td><td>${PST[x.statut]}${x.statut=='refuse'&&x.motif?' — '+esc(x.motif):''}</td></tr>`).join('')}</table></div>`:'<p class="mu">Aucune demande.</p>'}`}
function tarSend(pid){const u=S.u,p=(D.tar||[]).find(x=>x.id==pid&&x.actif);if(!p)return alert("Cette offre n'est plus disponible.");if(!tOk(p,tNbCol(u.id)))return alert('Cette offre ne correspond pas à votre nombre de collecteurs.');if((D.dpay||[]).some(x=>x.adm==u.id&&x.statut=='attente'))return alert('Une demande est déjà en attente.');const ref=$('pm_r').value.trim();if(!ref)return alert('Saisissez la référence de la transaction.');
(D.dpay=D.dpay||[]).push({id:uid(),adm:u.id,tar:p.id,nom:p.nom,mois:p.mois,montant:tPrix(p,tNbCol(u.id)),mode:$('pm_m').value,ref,date:T(),ts:Date.now(),statut:'attente'});
D.users.filter(x=>x.role=='sa').forEach(s=>notif(s.id,'Nouvelle demande de paiement',adN(u.id)+' · '+p.nom+' · '+F(tPrix(p,tNbCol(u.id))),'pm','💳'));S.tp='';save();alert("Demande envoyée. Elle sera validée par l'administration.");dash()}
/* --- Validation des paiements (admin du logiciel) --- */
function pmPend(){const L=(D.dpay||[]).filter(x=>x.statut=='attente').sort((a,b)=>a.ts-b.ts);
return`<h3>Demandes de paiement à valider</h3>${L.map(x=>`<div class="card" style="display:block;margin-bottom:10px"><b>${esc(adN(x.adm))}</b> <span class="tag">${esc(x.nom)}</span><p class="mu">Montant : <b>${F(x.montant)}</b> · ${x.mois} mois · ${esc(x.mode)}<br>Référence : <b>${esc(x.ref)}</b> · Demandé le ${x.date}</p><div class="row"><button class="btn s y" onclick="dpOk('${x.id}')">Valider le paiement</button><button class="btn s r" onclick="dpNo('${x.id}')">Refuser</button></div></div>`).join('')||'<p class="mu">Aucune demande en attente.</p>'}`}
function dpOk(id){const x=(D.dpay||[]).find(k=>k.id==id);if(!x||x.statut!='attente')return;if(!confirm('Confirmer que le paiement de '+F(x.montant)+' a bien été reçu ?'))return;const f=encaisse(x.adm,x.mois,x.montant,x.nom,x.mode,x.ref);tLim(x.adm,x.tar);x.statut='ok';x.dd=T();x.fac=f?f.num:'';save();dash()}
function dpNo(id){const x=(D.dpay||[]).find(k=>k.id==id);if(!x||x.statut!='attente')return;const m=prompt("Motif du refus (visible par l'administrateur) :");if(m===null)return;x.statut='refuse';x.dd=T();x.motif=(m||'').trim();notif(x.adm,'Paiement refusé',(x.motif||'Aucun motif précisé')+' · '+x.nom,'tf','⚠️');save();dash()}
function tarFill(id){const n=+$('mo'+id).value,nc=tNbCol(id),p=(D.tar||[]).find(t=>t.actif&&t.mois==n&&tOk(t,nc));if(p)$('mp'+id).value=fmN(tPrix(p,nc))}
/* --- Facturation --- */
function facList(){return(D.fac||[]).filter(f=>R=='sa'||f.adm==S.u.id).sort((a,b)=>b.num>a.num?1:-1)}
function fcView(){const L=facList(),tt=L.reduce((s,f)=>s+f.montant,0);
return`<div class="st"><div><b>${L.length}</b>Factures</div><div><b>${F(tt)}</b>Montant total</div></div>`+(L.length?`<div class="tb"><table><tr><th>N°</th><th>Date</th>${R=='sa'?'<th>Administrateur</th>':''}<th>Offre</th><th>Montant</th><th></th></tr>${L.map(f=>`<tr><td>${f.num}</td><td>${f.date}</td>${R=='sa'?`<td>${esc(adN(f.adm))}</td>`:''}<td>${esc(f.plan)}</td><td>${F(f.montant)}</td><td><button class="btn s" onclick="facPrint('${f.id}')">Voir / Imprimer</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Aucune facture pour le moment. Une facture est créée automatiquement à chaque paiement validé.</p>')}
function facHtml(f){const c=tc(),u=D.users.find(x=>x.id==f.adm)||{},o=(D.org||{})[f.adm]||{},td='padding:8px;border:1px solid #bbb';
return`<div style="font-family:Arial,sans-serif;color:#111;padding:8px"><table style="width:100%;border:0"><tr><td style="vertical-align:top"><h1 style="margin:0;font-size:28px">FACTURE</h1><div>N° <b>${esc(f.num)}</b></div><div>Date : ${f.date}</div></td><td style="text-align:right;vertical-align:top"><b style="font-size:18px">${esc(c.emet)}</b><br>${esc(c.adr)}<br>${esc(c.tel)}</td></tr></table><hr style="margin:16px 0"><div><b>Facturé à :</b><br>${esc(o.nom||u.nom||'')}<br>Responsable : ${esc(u.nom||'')}<br>Tél : ${esc(u.tel||'')}</div>
<table style="width:100%;border-collapse:collapse;margin-top:20px"><tr style="background:#eee"><th style="text-align:left;${td}">Désignation</th><th style="${td}">Période</th><th style="text-align:right;${td}">Montant</th></tr><tr><td style="${td}">${esc(f.plan)} (${f.mois} mois)</td><td style="${td};text-align:center">${f.du||''} → ${f.au||''}</td><td style="${td};text-align:right">${F(f.montant)}</td></tr><tr><td colspan="2" style="${td};text-align:right"><b>TOTAL</b></td><td style="${td};text-align:right"><b>${F(f.montant)}</b></td></tr></table>
