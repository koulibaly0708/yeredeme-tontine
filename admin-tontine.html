<div id="app"></div>
<script>
const $=id=>document.getElementById(id),T=()=>new Date().toISOString().slice(0,10),F=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')+' GNF',num=v=>+String(v).replace(/\D/g,'')||0,fmtI=e=>{const d=e.value.replace(/\D/g,'');e.value=d.replace(/\B(?=(\d{3})+(?!\d))/g,'\u00A0')};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D={users:[],mem:[],dep:[],ret:[],grp:[],set:{com:1},cfg:{},app:[],abo:[],rem:[],org:{},seq:{},pret:[],pcom:[]};
try{D=Object.assign(D,JSON.parse(localStorage.getItem('yt')||'{}'))}catch(e){}
const ph=s=>{let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00224'))d=d.slice(5);else if(d.startsWith('224')&&d.length>=12)d=d.slice(3);return d};
D.users.forEach(u=>u.tel=ph(u.tel));D.mem.forEach(m=>m.tel=ph(m.tel));
const save=()=>{try{localStorage.setItem('yt',JSON.stringify(D))}catch(e){alert("Enregistrement impossible : espace plein.")}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
D.seq=D.seq||{};
const dmy=d=>d.slice(8,10)+d.slice(5,7)+d.slice(2,4);
const nextSn=(a,d)=>{D.seq[a]=(D.seq[a]||0)+1;return 'TN-'+String(D.seq[a]).padStart(4,'0')+'-'+dmy(d||T())};
if(D.mem.some(m=>!m.sn||!/^TN-\d{4}-\d{6}$/.test(m.sn))){D.mem.forEach(m=>{const c=D.users.find(u=>u.id==m.mgr);if(!m.sn)m.sn=nextSn(c?c.adm:'x',m.date);else if(/^TN-\d{4}$/.test(m.sn))m.sn+='-'+dmy(m.date||T())});try{localStorage.setItem('yt',JSON.stringify(D))}catch(e){}}
const nextPr=a=>{const k='P'+a;D.seq[k]=(D.seq[k]||0)+1;return 'PR-'+String(D.seq[k]).padStart(4,'0')};
D.pret.forEach(p=>{if(p.mise==null){const m=D.mem.find(x=>x.id==p.mid)||{};p.mise=(p.statut=='demande'||p.statut=='refuse')?(m.mise||1):Math.ceil(p.total/p.nb);p.k=Math.round((p.rembourse||0)/p.mise);p.fg=0;p.serv=0;p.net=p.montant;p.dur=1;p.pen=0;p.fin=p.ech||p.dateDec||''}});
const isCl=m=>m.statut=='normal'||m.statut=='interrompu';
const tg=m=>`<span class="tag ${m.statut=='interrompu'?'rg':m.statut=='normal'?'gn':''}">${stt(m)}</span>`;
const ban=m=>m.statut=='normal'?'<div class="ban gn">Clôturé et payé</div>':m.statut=='interrompu'?'<div class="ban rg">Clôturé interrompu et payé</div>':m.statut=='attente'?'<div class="ban">Clôture en attente de validation</div>':'';
const owed=m=>{const c=D.users.find(u=>u.id==m.mgr),t=tot(m),cm=Math.min(cfg(c&&c.adm).com*m.mise,t);return Math.max(0,t-cm)};
const tot=m=>D.dep.filter(d=>d.mid==m.id).reduce((a,d)=>a+d.montant,0),carr=m=>Math.min(31,Math.floor(tot(m)/m.mise)),
stt=m=>m.statut=='normal'?'Clôturé normal':m.statut=='interrompu'?'Clôturé interrompu':m.statut=='attente'?'Clôture en attente de validation':'En cours';
let S={u:null,view:'h',menu:false,cper:'all',tab:'',m:null,day:T(),per:'j',photo:'',mode:'in'};
const TTL={g:'Espace collecteur',a:'Espace adhérent',ad:'Administrateur de tontine',sa:'Administrateur du logiciel'};
const roleLbl=u=>{const f=u.sx=='f';return u.role=='a'?(f?'Cliente':'Client'):u.role=='g'?(f?'Collectrice':'Collecteur'):u.role=='ad'?(f?'Administratrice de tontine':'Administrateur de tontine'):'Administrateur du logiciel'};
const adm=u=>D.users.find(x=>x.id==u.adm);
function msgU(u){if(u.role=='ad')return !u.actif?"Compte en attente d'activation par l'administrateur du logiciel.":(u.exp||'')<T()?"Abonnement expiré. Contactez l'administrateur du logiciel.":'';
if(u.role=='g'){if(u.actif===false)return 'Compte suspendu par votre administrateur.';const a=adm(u);return a?msgU(a):"Compte non rattaché à un administrateur de tontine."}return''}
function login(r,start){try{S.u=D.users.find(x=>x.id==localStorage.getItem('yt_'+r))||null}catch(e){}if(S.u&&msgU(S.u))S.u=null;S.tab=start;S.view='h';S.u?dash():authView()}
function authView(){const cu=R=='a'||R=='ad'||(R=='sa'&&!D.users.some(u=>u.role=='sa')),setup=R=='sa'&&cu;if(!cu)S.mode='in';if(setup)S.mode='up';const up=S.mode=='up';
$('app').innerHTML=`<div class="bar"><a class="plat" href="${R=='sa'?'#':'index.html'}"><img src="logo.png" alt="Yèrèdèmè Tontine"></a></div><div class="au"><div class="af"><div class="lgw"><img src="logo.png" alt="Yèrèdèmè Tontine"></div><h2>${TTL[R]}</h2>
${setup?'<p class="mu">Première utilisation : créez le compte administrateur du logiciel.</p>':cu?`<div class="row"><button class="btn s ${up?'o':''}" onclick="S.mode='in';authView()">Connexion</button><button class="btn s ${up?'':'o'}" onclick="S.mode='up';authView()">Inscription</button></div>`:''}
${up?'<label>Nom complet</label><input id="an">'+(R!='sa'?'<label>Genre</label><select id="ag"><option value="m">Homme</option><option value="f">Femme</option></select>':''):''}<label>Téléphone (sans +224)</label><input id="at" inputmode="tel" placeholder="6XX XX XX XX"><label>Mot de passe</label><input id="ap" type="password">
<button class="btn" onclick="go()">${up?'Créer mon compte':'Se connecter'}</button>${up&&R=='a'?'<p class="mu">Utilisez le numéro donné à votre collecteur pour voir vos tontines.</p>':''}${up&&R=='ad'?'<p class="mu">Votre compte sera utilisable après activation de votre abonnement.</p>':''}${R=='g'?'<p class="mu">Votre compte est créé par votre administrateur de tontine.</p>':''}</div></div>`}
function go(){const t=ph($('at').value),p=$('ap').value;if(!t||!p)return alert('Renseignez téléphone et mot de passe.');let u=D.users.find(x=>x.tel==t&&x.role==R);
if(S.mode=='up'){const n=$('an').value.trim();if(!n)return alert('Renseignez votre nom.');if(u)return alert('Ce numéro a déjà un compte. Connectez-vous.');if(R=='sa'&&D.users.some(x=>x.role=='sa'))return;
u={id:uid(),role:R,nom:n,tel:t,pwd:p,sx:($('ag')||{}).value||'m'};if(R=='ad'){u.actif=false;u.exp=''}D.users.push(u);save();
if(R=='ad'){alert("Compte créé. Il sera utilisable après activation de votre abonnement par l'administrateur du logiciel.");S.mode='in';return authView()}}
else{if(!u||u.pwd!=p)return alert('Téléphone ou mot de passe incorrect.');const m=msgU(u);if(m)return alert(m)}
try{localStorage.setItem('yt_'+R,u.id)}catch(e){}S.u=u;dash()}
function out(){try{localStorage.removeItem('yt_'+R)}catch(e){}location.href=R=='sa'?'admin-logiciel.html':'index.html'}
function dash(){const TL=Object.fromEntries(TABS),I=TI,G=TG,
bar=`<div class="bar np"><a class="plat" href="${R=='sa'?'#':'index.html'}"><img src="logo.png" alt="Yèrèdèmè Tontine"></a><div class="usr"><div class="un"><b>${esc(S.u.nom)}</b><small>${roleLbl(S.u)}</small></div><button class="btn o s" onclick="out()">Déconnexion</button></div></div>`;
if(S.view=='h'){$('app').innerHTML=bar+`<div class="w">${R=='a'?noticeP():''}${G.map(([g,ids])=>`<section class="nv-g"><h3 class="nv-gt">${g}</h3><div class="nv-tiles">${ids.map(k=>`<button class="nv-tile" onclick="nav('${k}')"><span class="nv-ti" aria-hidden="true">${I[k]}</span><span>${TL[k]}</span></button>`).join('')}</div></section>`).join('')}</div>`;return}
$('app').innerHTML=bar+`<div class="w"><div class="nv-nav np"><div class="nv-bar"><button class="nv-b" onclick="navHome()">← Accueil</button><h2 class="nv-t">${TL[S.tab]}</h2><button class="nv-b m" aria-expanded="${S.menu}" onclick="S.menu=!S.menu;dash()">Menu ▾</button></div>
${S.menu?`<nav class="nv-mnu">${G.map(([g,ids])=>`<h3 class="nv-gt">${g}</h3><div class="nv-mg">${ids.map(k=>`<button class="nv-mi" aria-selected="${k==S.tab}" onclick="nav('${k}')"><span class="nv-ti" aria-hidden="true">${I[k]}</span>${TL[k]}</button>`).join('')}</div>`).join('')}</nav>`:''}</div>${typeof EX!=='undefined'&&EX[S.tab]&&!S.m?`<div class="row np"><button class="btn s y" onclick="exportTab()">⬇ Exporter Excel</button></div>`:''}<div id="v"></div></div>`;
$('v').innerHTML=S.m?detail():V[S.tab]()}
function nav(k){if(S.view!='t')history.pushState({t:1},'');S.view='t';S.tab=k;S.m=null;S.menu=false;dash();scrollTo(0,0)}
function navHome(){if(history.state&&history.state.t)history.back();else{S.view='h';S.m=null;S.menu=false;dash()}}
addEventListener('popstate',()=>{S.view='h';S.m=null;S.menu=false;if(S.u)dash()});
const cfg=a=>Object.assign({com:1,mode:'pct',val:0,pm:'pct',pv:0,pn:30,pdur:1,ppm:'pct',ppv:0,pfm:'pct',pfv:0,pmin:0},D.cfg&&D.cfg[a]);
const split=(a,m)=>{const c=cfg(a),cm=c.com*m.mise,cc=c.mode=='fix'?c.val:Math.round(cm*c.val/100);return{cm,cc:Math.max(0,Math.min(cc,cm))}};
const colls=()=>R=='ad'?D.users.filter(u=>u.role=='g'&&u.adm==S.u.id):[];
const intr=(a,mt)=>{const c=cfg(a);return c.pm=='fix'?c.pv:Math.round(mt*c.pv/100)};
const loanOf=m=>D.pret.find(p=>p.mid==m.id&&p.statut=='accepte');
const mises=m=>D.dep.filter(d=>d.mid==m.id).reduce((a,d)=>a+(d.n||0),0);
const lnTerms=(a,mise,P,dur)=>{const c=cfg(a),fg=c.pfm=='fix'?c.pfv:Math.round(P*c.pfv/100),serv=dur*mise,it=c.pm=='fix'?c.pv*dur:Math.round(P*c.pv/100*dur);return{fg,net:P-fg,serv,interet:it,total:P+serv+it,nb:Math.max(1,Math.ceil((P+serv)/mise)),max:30*mise*dur}};
const penUpd=p=>{if(p.statut!='accepte'||!p.fin||T()<=p.fin)return;const c=cfg(p.adm),ml=Math.ceil(Math.floor((new Date(T())-new Date(p.fin))/864e5)/31),base=Math.max(0,p.total-p.rembourse),pen=c.ppm=='fix'?c.ppv*ml:Math.round(base*c.ppv/100*ml);if(pen>(p.pen||0))p.pen=pen};
const due=p=>{penUpd(p);return Math.max(0,p.total+(p.pen||0)-p.rembourse)};
const instAmt=(p,i)=>i<p.nb?p.mise:i==p.nb?p.total+(p.pen||0)-(p.nb-1)*p.mise:p.mise;
const lnPlan=(m,n)=>{const p=loanOf(m);if(!p)return null;let k=p.k||0,left=due(p),rep=0;for(let i=1;i<=n&&left>0;i++){k++;const a=Math.min(Math.max(1,instAmt(p,k)),left);rep+=a;left-=a}
const pa=p.rembourse+rep,pp=Math.max(0,Math.min(p.pen||0,pa-p.total))-Math.max(0,Math.min(p.pen||0,p.rembourse-p.total));return{p,rep,k,pp}};
const lnRep=(m,n)=>{const q=lnPlan(m,n);return q?q.rep:0};

function payCom(cid){const rows=comPayable(D.users.find(u=>u.id==cid));if(!rows.length)return alert("Aucune commission payable : le paiement des commissions se fait à la fin du mois.");const sum=rows.reduce((a,r)=>a+r.comCol,0);
if(!confirm('Payer '+F(sum)+' de commission à '+nm2(cid)+' ? Son solde commission sera remis à zéro.'))return;const id=uid();D.pcom.push({id,adm:S.u.id,col:cid,date:T(),mois:[...new Set(rows.map(r=>r.date.slice(0,7)))].sort().join(', '),montant:sum,n:rows.length});rows.forEach(r=>r.pay=id);save();alert('Commission payée : '+F(sum)+'. Solde commission : '+F(comSolde(D.users.find(u=>u.id==cid)))+'.');dash()}

function decP(id,ok){const p=D.pret.find(x=>x.id==id),m=D.mem.find(x=>x.id==p.mid),av=$('av'+id).value.trim();if(!av)return alert("Saisissez votre avis avant de valider ou de refuser.");
const c=cfg(S.u.id),mi=p.mise||m.mise,du=p.dur||1,t=lnTerms(S.u.id,mi,p.montant,du);
if(ok){if(mises(m)<c.pmin)return alert("Ce client n'a effectué que "+mises(m)+" mise(s) : "+c.pmin+" minimum avant de bénéficier d'un prêt.");if(p.montant>t.max)return alert('Montant supérieur au maximum pour cette durée ('+F(t.max)+').');if(du>c.pdur)return alert('Durée supérieure au maximum autorisé ('+c.pdur+' mois).')}
if(!confirm(ok?`Accepter le prêt ${p.sn} : ${F(p.montant)} sur ${du} mois, net remis ${F(t.net)}, total à rembourser ${F(t.total)} en ${t.nb} échéances de ${F(mi)} ?`:`Refuser le prêt ${p.sn} ?`))return;
p.statut=ok?'accepte':'refuse';if(ok)Object.assign(p,{fg:t.fg,net:t.net,serv:t.serv,interet:t.interet,total:t.total,nb:t.nb,mise:mi,k:0,pen:0,fin:plusMois(T(),du)});p.avis=av;p.dateDec=T();p.vu=false;save();dash()}
function addC(){const n=$('cn').value.trim(),t=ph($('ct').value),p=$('cp').value;if(!n||!t||!p)return alert('Nom, téléphone et mot de passe sont obligatoires.');if(D.users.some(u=>u.role=='g'&&u.tel==t))return alert('Ce numéro est déjà utilisé par un collecteur.');D.users.push({id:uid(),role:'g',nom:n,tel:t,pwd:p,adm:S.u.id,actif:true,sx:$('cg').value});save();dash()}

mo.innerHTML=`<div class="bx"><h3>Remise de ${esc(c.nom)}</h3><p class="mu">UV attribué ${F(j.ap)} · Mises ${F(j.mi)}</p><label>Espèces reçues (GNF)</label><input id="rc" inputmode="numeric" value="${nf(j.mi)}" oninput="fmtI(this)"><label>UV restitué (GNF)</label><input id="ru" inputmode="numeric" value="${nf(j.so)}" oninput="fmtI(this)"><div class="row"><button class="btn s" onclick="saveRem('${cid}')">Enregistrer</button><button class="btn s o" onclick="mo.remove()">Annuler</button></div></div>`;document.body.append(mo)}

function logoOrg(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.logoTmp=c.toDataURL('image/png');alert('Logo prêt. Cliquez sur « Enregistrer ma tontine ».')};im.src=r.result};r.readAsDataURL(f)}
