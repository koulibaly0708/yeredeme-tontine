function gRet(x,hs,pot){const a=gAdmOf(x),r=gRule(a),c=cfg(a);let ret=r.mode=='pct'?Math.round(pot*r.val/100):hs.reduce((s,h)=>s+h.montant,0);ret=Math.max(0,Math.min(ret,pot));const cc=c.mode=='fix'?c.val:Math.round(ret*c.val/100);return{ret,cc:Math.max(0,Math.min(cc,ret)),net:pot-ret}}

if(loanOf(m)&&carr(m)+n>31)return alert("La fiche est complète (31 mises) alors que le prêt n'est pas soldé. Réglez le reste en anticipation ou continuez sur une nouvelle tontine (onglet Prêts).");if(carr(m)+n>31&&!confirm('Cette mise dépasse les 31 cases de la fiche. Continuer ?'))return;
const d={id:uid(),mid:m.id,date:dt,montant:a,n},q=lnPlan(m,n);if(q&&rep>0){d.rp=q.rep;d.pid=q.p.id;d.pp=q.pp;q.p.rembourse+=q.rep;q.p.k=q.k;if(q.p.rembourse>=q.p.total+(q.p.pen||0)){q.p.statut='solde';q.p.dateSolde=dt}d.rr=Math.max(0,q.p.total+(q.p.pen||0)-q.p.rembourse)}if(uvd!==dt)d.uvd=uvd;D.dep.push(d);save();rec(d.id)}
function clo(id,t){const m=D.mem.find(x=>x.id==id);if(loanOf(m))return alert('Prêt '+loanOf(m).sn+' non soldé (reste '+F(due(loanOf(m)))+') : soldez-le avant la clôture, sinon le client ne perçoit rien.');if(!confirm(`Envoyer la demande de ${t=='normal'?'clôture normale':'clôture interrompue'} (${F(tot(m))} collectés)${loanOf(m)?' — ATTENTION : prêt non soldé, reste '+F(due(loanOf(m))):''} à l'administrateur ?`))return;m.statut='attente';m.dem=t;m.demDate=T();save();dash()}
/* --- onglet « Clôture de tontine » : tontines individuelles et tontines de groupe --- */

const ms=mine(),cours=ms.filter(m=>m.statut=='cours'),att=ms.filter(m=>m.statut=='attente'),fin=ms.filter(isCl),rt=m=>D.ret.find(x=>x.mid==m.id),
gv=grpVis(),gl=gv?gMine():[],gT=[],gA=[],gP=[],gM=[];
gl.forEach(x=>{x.hist.forEach((t,i)=>{if(t.st=='tirage')gT.push({x,t,i});else if(t.st=='attente')gA.push({x,t,i});else if(t.st=='paye')gP.push({x,t,i})});const cv=gCovered(x,x.cyc);if(cv)gM.push({x,cv})});
const nm=m=>esc(m.prenom+' '+m.nom),
ind=cours.map(m=>{const c=carr(m),ln=loanOf(m);return`<div class="card" style="display:block;margin-bottom:10px"><b>${nm(m)}</b> <span class="tag">${m.sn}</span><p class="mu">${esc(m.tel)} · ${esc(m.q||'')}<br>Mise : ${F(m.mise)} · Cases : <b>${c}/31</b>${c>=31?' ✔ fiche complète':''}<br>Total collecté : <b>${F(tot(m))}</b>${ln?'<br><span class="tag rg">Prêt non soldé : reste '+F(due(ln))+'</span>':''}</p><div class="row np"><button class="btn s y" onclick="clo('${m.id}','normal')">Clôture normale</button><button class="btn s r" onclick="clo('${m.id}','interrompu')">Interrompre</button><button class="btn s o" onclick="S.m='${m.id}';dash()">Ouvrir</button></div></div>`}).join('')||'<p class="mu">Aucune tontine individuelle en cours.</p>',
indAtt=att.map(m=>`<tr><td>${m.sn}</td><td><b>${nm(m)}</b></td><td>${m.dem=='normal'?'Normale':'Interrompue'}</td><td>${m.demDate||''}</td><td>${F(tot(m))}</td><td>En attente de validation par l'administrateur</td></tr>`).join(''),
indFin=fin.slice().sort((a,b)=>((rt(b)||{}).date||'')>((rt(a)||{}).date||'')?1:-1).slice(0,30).map(m=>{const r=rt(m);return`<tr><td>${r?r.date:''}</td><td>${m.sn}</td><td><b>${nm(m)}</b></td><td>${m.statut=='normal'?'Normale':'Interrompue'}</td><td>${r?F(r.montant):'—'}</td><td>${r?`<button class="btn s" onclick="recPay('${r.id}')">Reçu</button>`:''}</td></tr>`}).join(''),
tourCard=({x,t,i})=>`<div class="card" style="display:block;margin-bottom:10px"><b>${esc(x.nom)}</b> (${x.sn||''}) <span class="tag">${t.cmp?'Normale':'Interrompue'}</span><p class="mu">Bénéficiaire : ${gWins(x,t)} · Mois ${gMois(t)}${t.adv?" (avance d'un mois)":''}<br>Cagnotte : ${F(t.montant)} · Retenue : ${F(t.ret||0)}<br>À payer : <b>${F(t.net)}</b>${t.inf?'<br>Membres informés le '+t.infDate:''}</p><div class="row np">${t.inf?'':`<button class="btn s o" onclick="gInform('${x.id}',${i})">📣 Informer</button>`}<button class="btn s y" onclick="gClose('${x.id}',${i})">Clôturer et demander le paiement</button></div></div>`,
mCard=({x,cv})=>`<div class="card" style="display:block;margin-bottom:10px"><b>${esc(x.nom)}</b> (${x.sn||''})<p class="mu">Mois ${x.cyc} : couvert par le tour de ${gWins(x,cv)} (deux mains reçues d'un coup).</p><div class="row np"><button class="btn s y" onclick="gMonthEnd('${x.id}')">Clôturer le mois ${x.cyc}${x.cyc==cv.k+cv.nb-1?(cv.adv?" (remboursement de l'avance)":' et calculer la cagnotte'):''}</button></div></div>`,
grp=gl.map(x=>{const rest=gRestH(x);return`<tr><td>${x.sn||''}</td><td><b>${esc(x.nom)}</b></td><td>${x.mem.length}</td><td>${x.done.length}/${x.mem.length}</td><td>${rest.length?'Mois '+x.cyc+' en cours':'Groupe terminé'}</td></tr>`}).join('')||'<tr><td colspan=5>Aucun groupe.</td></tr>',
gFin=gP.slice().sort((a,b)=>(b.t.payDate||'')>(a.t.payDate||'')?1:-1).slice(0,30).map(({x,t})=>`<tr><td>${t.payDate||''}</td><td><b>${esc(x.nom)}</b> (${x.sn||''})</td><td>${gWins(x,t)}</td><td>${t.cmp?'Normale':'Interrompue'}</td><td>${F(t.net)}</td><td>${t.rid?`<button class="btn s" onclick="gRec('${t.rid}')">Reçu</button>`:''}</td></tr>`).join('');
return`<p class="mu">Clôturez ici les tontines individuelles de vos clients et, si l'option est activée, les tours de vos tontines de groupe. Chaque clôture est envoyée à votre administrateur, qui la valide et effectue le paiement.</p>
<div class="st"><div><b>${cours.length}</b>Tontines individuelles en cours</div><div><b>${att.length+gA.length}</b>Clôtures en attente de validation</div><div><b>${fin.length+gP.length}</b>Clôtures validées et payées</div>${gv?`<div><b>${gT.length+gM.length}</b>Groupes : tours à clôturer</div>`:''}</div>
<h3 style="margin-top:18px">Tontines individuelles à clôturer</h3><p class="mu">« Clôture normale » : la tontine est menée à son terme. « Interrompre » : le client arrête avant la fin. Un prêt non soldé doit d'abord être remboursé.</p>
${ind}
${att.length?`<h3 style="margin-top:18px">Individuelles : en attente de validation</h3><div class="tb"><table><tr><th>N°</th><th>Client</th><th>Type</th><th>Demandée le</th><th>Total collecté</th><th>État</th></tr>${indAtt}</table></div>`:''}
${fin.length?`<h3 style="margin-top:18px">Individuelles : clôturées</h3><div class="tb"><table><tr><th>Date</th><th>N°</th><th>Client</th><th>Type</th><th>Payé</th><th></th></tr>${indFin}</table></div>`:''}
${gv?`<h3 style="margin-top:26px">Tontines de groupe à clôturer</h3>${gT.map(tourCard).join('')+gM.map(mCard).join('')||'<p class="mu">Aucun tour de groupe à clôturer pour le moment. Tirez le bénéficiaire du mois dans l\'onglet « Tontine groupe » : il apparaîtra ici.</p>'}
${gA.length?`<h3 style="margin-top:18px">Groupes : en attente de validation</h3>${gA.map(({x,t})=>`<div class="card" style="display:block;margin-bottom:10px"><b>${esc(x.nom)}</b> (${x.sn||''}) <span class="tag">${t.cmp?'Normale':'Interrompue'}</span><p class="mu">Bénéficiaire : ${gWins(x,t)} · Mois ${gMois(t)}<br>À payer : <b>${F(t.net)}</b> · demandée le ${t.demDate||''} · en attente de validation par l'administrateur</p></div>`).join('')}`:''}
<h3 style="margin-top:18px">Mes groupes</h3><div class="tb"><table><tr><th>N°</th><th>Groupe</th><th>Membres</th><th>Ont reçu</th><th>État</th></tr>${grp}</table></div>
${gP.length?`<h3 style="margin-top:18px">Groupes : tours payés</h3><div class="tb"><table><tr><th>Date</th><th>Groupe</th><th>Bénéficiaire</th><th>Type</th><th>Payé</th><th></th></tr>${gFin}</table></div>`:''}`:''}`}
function gmRender(){$('gml').innerHTML=gmHtml()}
function gmDel(i){S.gm.splice(i,1);gmRender()}
function csv(){const ids=mine().map(m=>m.id),L=['Date;Client;Montant'];D.dep.filter(d=>ids.includes(d.mid)).forEach(d=>{const m=D.mem.find(x=>x.id==d.mid);L.push(`${d.date};${m.prenom} ${m.nom};${d.montant}`)});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+L.join('\n')],{type:'text/csv'}));a.download='mises.csv';a.click()}
const rpIn=d=>{const n=S.per=='j'?10:S.per=='m'?7:4;return d.slice(0,n)==S.day.slice(0,n)};
const EX={pw:()=>{const w=wal(S.u);return[{n:'Portefeuille UV',rows:[['Date','Approvisionnement','Mises','Retours UV validés','Restitué','Portefeuille']].concat(w.L.map(r=>[r.d,r.ap,r.mi,r.rt,r.rm,r.s]))}]},
gr:()=>[{n:'Groupes',rows:[['Groupe','N°','Ordre','Membre','Téléphone','Quartier','Main','Mise par jour (GNF)','Cases du mois','Reçu']].concat(...gMine().map(x=>x.mem.map((h,i)=>[x.nom,x.sn||'',i+1,h.prenom+' '+h.nom,h.tel,h.q||'',h.main||1,h.montant,gCases(x,h),x.done.includes(h.id)?'Oui':'Non'])))}],
ad:()=>[{n:'Clients',rows:[['N° tontine','Nom','Prénom','Téléphone','Quartier','Mise (GNF)','État','Collecté (GNF)','Cases payées']].concat(mine().map(m=>[m.sn,m.nom,m.prenom,m.tel,m.q,m.mise,stt(m),tot(m),carr(m)]))}],
rp:()=>[{n:'Mises',rows:[['Date','N° tontine','Client','Nombre de mises','Montant (GNF)','Remboursement prêt (GNF)']].concat(dps().filter(d=>rpIn(d.date)).map(d=>{const m=memOf(d);return[d.date,m.sn,m.prenom+' '+m.nom,d.n||Math.round(d.montant/m.mise),d.montant,d.rp||0]}))}],
cx:()=>[{n:'Mes commissions',rows:[['Date','N° tontine','Client','Téléphone','Commission (GNF)','Ma part (GNF)']].concat(cmFilter().map(x=>{const m=memOf(x);return[x.date,m.sn,m.prenom+' '+m.nom,m.tel,x.com,x.comCol||0]}))},{n:'Commissions perçues',rows:[['Date','Mois','Montant (GNF)']].concat(D.pcom.filter(x=>x.col==S.u.id).map(x=>[x.date,x.mois,x.montant]))}],
ca:()=>[{n:'Remises',rows:[['Date','UV reçu','Espèces remises','UV restitué','Écart']].concat(D.rem.filter(x=>x.col==S.u.id).map(x=>[x.date,x.appro,x.cash,x.uv,x.ecart]))},{n:'UV reçus',rows:[['Date','Montant UV (GNF)']].concat(D.app.filter(x=>x.col==S.u.id).map(x=>[x.date,x.montant]))}],
pt:()=>[{n:'Prêts',rows:[['N° prêt','N° tontine','Client','Date demande','Montant','Intérêt','Total','Remboursé','Reste','Échéance','État','Avis']].concat(D.pret.filter(p=>p.col==S.u.id).map(p=>{const m=D.mem.find(x=>x.id==p.mid);return[p.sn,m.sn,m.prenom+' '+m.nom,p.dateDem,p.montant,p.interet,p.total,p.rembourse,p.total-p.rembourse,p.ech||'',p.statut,p.avis||'']}))}]};
function settle(id){const p=D.pret.find(x=>x.id==id),m=D.mem.find(x=>x.id==p.mid),r=due(p),dt=T(),j=jour(S.u,dt);if(remDe(S.u,dt))return alert("La journée est déjà remise à l'administrateur.");if(r>j.so)return alert('Solde UV insuffisant ('+F(j.so)+').');
if(!confirm('Encaisser le reste du prêt '+p.sn+' en anticipation : '+F(r)+' ?'))return;const b=Math.max(0,Math.min(p.pen||0,p.rembourse-p.total));p.rembourse+=r;const a=Math.max(0,Math.min(p.pen||0,p.rembourse-p.total)),d={id:uid(),mid:m.id,date:dt,montant:0,n:0,rp:r,pp:a-b,pid:p.id,rr:0};p.statut='solde';p.dateSolde=dt;D.dep.push(d);save();rec(d.id)}
function transferLoan(id){const p=D.pret.find(x=>x.id==id),m=D.mem.find(x=>x.id==p.mid),c=D.mem.filter(x=>x.tel==m.tel&&x.mgr==S.u.id&&x.statut=='cours'&&x.id!=m.id&&!loanOf(x));
if(!c.length)return alert("Ouvrez d'abord une nouvelle tontine pour ce client (onglet Clients, même numéro de téléphone), puis transférez le prêt.");
let t=c[0];if(c.length>1){const k=parseInt(prompt('Choisissez la nouvelle tontine :\n'+c.map((x,i)=>(i+1)+') '+x.sn).join('\n')),10);if(!(k>=1&&k<=c.length))return;t=c[k-1]}
if(!confirm('Continuer le remboursement du prêt '+p.sn+' sur la tontine '+t.sn+' ?'))return;p.hist=(p.hist||[]).concat(m.id);p.mid=t.id;save();alert('Prêt transféré sur la tontine '+t.sn+'.');dash()}
function ptInfo(){const m=D.mem.find(x=>x.id==$('pc').value);if(!m){$('pic').innerHTML='';return}const P=num($('pm').value),dur=+$('pd').value||1,c=cfg(S.u.adm),t=lnTerms(S.u.adm,m.mise,P,dur),act=D.pret.find(p=>p.mid==m.id&&(p.statut=='demande'||p.statut=='accepte')),mi=mises(m),need=Math.ceil(P/(30*m.mise));

function addP(){const m=D.mem.find(x=>x.id==$('pc').value),P=num($('pm').value),dur=+$('pd').value||1,mo=$('pmt').value.trim(),c=cfg(S.u.adm);if(!m)return alert('Choisissez un client.');if(!(P>0))return alert('Saisissez le montant souhaité.');if(!mo)return alert('Indiquez le motif du prêt.');

D.pret.push({id:uid(),sn:nextPr(S.u.adm),mid:m.id,col:S.u.id,adm:S.u.adm,montant:P,dur,mise:m.mise,motif:mo,fg:t.fg,net:t.net,serv:t.serv,interet:t.interet,total:t.total,nb:t.nb,k:0,pen:0,rembourse:0,statut:'demande',dateDem:T(),avis:'',vu:true});save();alert("Demande envoyée à l'administrateur.");dash()}
